<tr><td>SIEM</td><td>Wazuh 4.12, tableau de bord</td><td>Centraliser les journaux, appliquer les règles, lever les alertes, chercher</td></tr>
<tr><td>HIDS</td><td>Modules de Wazuh : FIM, SCA, vulnérabilités</td><td>Surveiller les fichiers, la configuration et les failles de chaque machine</td></tr>
<tr><td>EDR</td><td>Elastic Security avec Elastic Defend 8.15</td><td>Voir les processus, reconstituer l'attaque, isoler un poste, tuer un processus</td></tr>
<tr><td>Pare-feu</td><td>OPNsense</td><td>Lire le journal de filtrage, corriger les règles</td></tr>
<tr><td>IDS</td><td>Suricata, alertes lues dans EveBox</td><td>Reconnaître des attaques connues dans le trafic</td></tr>
<tr><td>SOAR</td><td>Shuffle</td><td>Enchaîner automatiquement enrichissement, dossier d'incident et réponse</td></tr>
<tr><td>Boîte à outils</td><td>Recettes à la manière de CyberChef</td><td>Décoder, désarmer une adresse, calculer une empreinte</td></tr></table>
<p>Les consoles gardent leur langue d'origine, l'anglais, comme celles que vous installerez. Touche <kbd>L</kbd> pour le lexique à tout moment.</p>`},
{t:'Le réseau d\'Orbitale',h:`<div class="schema" data-schema="reseau"></div>
<p>Le réseau est découpé en zones. Chaque zone regroupe des machines qui ont le même niveau d'exposition et les mêmes besoins. Le pare-feu fw-01 est le seul point de passage entre les zones et vers Internet. Il porte aussi la sonde Suricata.</p>
<table class="t"><tr><th>Zone, interface de fw-01</th><th>Plage</th><th>Machines</th><th>Ce qui y est permis</th></tr>
<tr><td>Utilisateurs, LAN</td><td><code>10.20.0.0/24</code></td><td>PC-DG-01, PC-RH-02, PC-ACHATS-03 et 04, PC-COMPTA-07, PC-BE-05, PC-ACCUEIL-01</td><td>Accès aux serveurs, Internet en HTTP et HTTPS, jamais vers la production</td></tr>
<tr><td>Serveurs, SERVEURS</td><td><code>10.10.0.0/24</code></td><td>DC-01, SRV-FICHIERS-01, SRV-ENTRA01, SRV-CAO-01, SCAN-VULN, SRV-WAZUH, PC-ADMIN-01</td><td>Tout, pour l'instant</td></tr>
<tr><td>Production, PROD</td><td><code>10.30.0.0/24</code></td><td>PC-ATELIER-02</td><td>Licences CAO et agent Wazuh, plus une dérogation provisoire</td></tr>
<tr><td>DMZ</td><td><code>172.16.0.0/24</code></td><td>WEB-DMZ-01, le site vitrine</td><td>Rien vers l'interne, mises à jour en HTTPS</td></tr>
<tr><td>Internet, WAN</td><td>adresse publique <code>203.0.113.10</code></td><td></td><td>HTTPS et SSH vers le site vitrine</td></tr></table>
<div class="encadre piege"><b>Piège</b> Le poste d'administration PC-ADMIN-01 est rangé dans la zone des serveurs. C'est courant, et c'est un choix lourd : une session ouverte sur ce poste a tous les accès de la zone la plus sensible.</div>
<p class="note">Les adresses publiques du scénario appartiennent aux plages réservées à la documentation par la RFC 5737 et la RFC 2544. Elles ne mènent nulle part dans la réalité.</p>`},
{t:'La méthode de l\'analyste',h:`
<p class="intro">Un bon analyste ne devine pas, il prouve. Chaque conclusion repose sur un événement qu'il peut montrer.</p>
<table class="t"><tr><th>Principe</th><th>En pratique</th></tr>
<tr><td>Partir d'un fait</td><td>Une alerte, une heure, une machine. Jamais une impression</td></tr>
<tr><td>Formuler une hypothèse</td><td>« Si Word a lancé PowerShell, alors un document a été ouvert juste avant »</td></tr>
<tr><td>Pivoter</td><td>Passer d'un champ à une autre recherche : le compte, l'empreinte, l'adresse de destination, le processus parent</td></tr>
<tr><td>Croiser les sources</td><td>Ce que dit le SIEM, l'EDR le confirme-t-il ? Le pare-feu a-t-il vu le flux ?</td></tr>
<tr><td>Dater précisément</td><td>Toutes les machines sont à l'heure par NTP. Une chronologie fausse de deux minutes inverse une cause et un effet</td></tr>
<tr><td>Écrire au fil de l'eau</td><td>La main courante est la mémoire de l'enquête et la preuve de ce qui a été fait</td></tr></table>
<div class="encadre retenir"><b>À retenir</b> Une alerte n'est pas un incident. Une alerte est une question que pose un outil. L'analyste y répond par un verdict argumenté.</div>`}
]},
{id:'c1',num:'01',titre:'Le métier du SOC',obj:['Décrire l\'organisation d\'un SOC et ses niveaux','Suivre le cycle de vie d\'une alerte','Rendre un verdict et le justifier'],sections:[
{t:'Ce qu\'est un SOC',h:`
<p class="intro">Un SOC, Security Operations Center, est l'équipe, les processus et l'outillage qui surveillent le système d'information en continu, détectent les incidents et organisent la réponse.</p>
<p>Un SOC ne protège pas tout seul. Il voit ce que les sources lui envoient, il décide ce qui mérite une action, et il déclenche cette action avec les équipes informatiques. Sa valeur se mesure à deux choses : détecter tôt et réagir vite.</p>
<table class="t"><tr><th>Niveau</th><th>Rôle</th><th>Exemple chez Orbitale</th></tr>
<tr><td>N1, analyste de tri</td><td>Lit les alertes, écarte le bruit, qualifie, escalade avec des faits</td><td>« Dix tentatives SSH depuis une même adresse, bloquées par la réponse active, aucun succès »</td></tr>
<tr><td>N2, analyste d'investigation</td><td>Reconstitue l'attaque, cherche dans les journaux, contient</td><td>« PowerShell encodé lancé par Word, puis un exécutable inconnu, poste isolé »</td></tr>
<tr><td>N3, expert et chasse</td><td>Forensic, rétro-ingénierie, écriture de détections, chasse aux menaces</td><td>« Nouvelle règle qui détecte l'accès à la mémoire de LSASS »</td></tr></table>
<table class="t"><tr><th>Modèle</th><th>Principe</th><th>Limite</th></tr>
<tr><td>SOC interne</td><td>L'équipe est salariée de l'entreprise et connaît le métier</td><td>Coûteux, difficile de tenir une présence jour et nuit</td></tr>
<tr><td>SOC externalisé, MSSP</td><td>Un prestataire surveille plusieurs clients</td><td>Connaît mal le contexte, il faut lui écrire ce qui est normal</td></tr>
<tr><td>SOC hybride</td><td>Le prestataire assure la nuit et le tri, l'équipe interne l'investigation</td><td>Demande des procédures d'escalade très claires</td></tr></table>
<p>En France, l'ANSSI qualifie les prestataires de détection des incidents de sécurité, sous le nom PDIS. Un sous-traitant de la défense comme Orbitale peut se voir imposer un prestataire qualifié par ses donneurs d'ordre.</p>`},
{t:'Le cycle de vie d\'une alerte',h:`<div class="schema" data-schema="cycle"></div>
<p>Chaque alerte suit le même chemin. On la reçoit, on la qualifie, on l'enrichit, on décide. Si elle révèle un incident, on contient, on éradique, on rétablit, puis on rédige le retour d'expérience.</p>
<table class="t"><tr><th>Verdict</th><th>Sens</th><th>Exemple</th><th>Ce qu'on fait</th></tr>
<tr><td>Vrai positif malveillant</td><td>L'alerte a raison et c'est une attaque</td><td>Un document reçu par courriel lance PowerShell</td><td>Escalade, ouverture d'incident</td></tr>
<tr><td>Vrai positif bénin</td><td>L'alerte a raison, mais l'action est légitime</td><td>L'administrateur lance PsExec pour un ticket, la sauvegarde planifiée lance rclone</td><td>On documente, on affine la règle ou on ajoute une exception</td></tr>
<tr><td>Faux positif</td><td>La règle s'est trompée de cible</td><td>Une règle sur « mimikatz » qui se déclenche sur un document de formation qui contient ce mot</td><td>On corrige la règle</td></tr>
<tr><td>Faux négatif</td><td>Une attaque a eu lieu et rien n'a sonné</td><td>Un accès à la mémoire de LSASS sans règle</td><td>On écrit la détection qui manquait</td></tr></table>
<div class="encadre piege"><b>Piège</b> Un vrai positif bénin ressemble trait pour trait à une attaque. Ce qui les sépare n'est jamais le nom de l'outil, mais le contexte : qui l'a lancé, depuis où, par quel parent, vers quelle destination, et est-ce prévu ? Un ticket, une tâche planifiée connue ou un contrat de sauvegarde sont des preuves.</div>`},
{t:'Trier une alerte en cinq questions',h:`
<p class="intro">Le N1 traite des dizaines d'alertes par heure. Il lui faut une grille courte, toujours la même.</p>
<table class="t"><tr><th>Question</th><th>Où chercher</th></tr>
<tr><td>1. Quoi ? Qu'est-ce que la règle a vu exactement</td><td>La description de la règle et l'événement brut, pas seulement le titre</td></tr>
<tr><td>2. Qui ? Quel compte, quel processus</td><td>user, parentImage, image, commandLine</td></tr>
<tr><td>3. Où ? Quelle machine, quelle zone, quel rôle</td><td>La fiche de l'agent, le plan du réseau</td></tr>
<tr><td>4. Quand ? Qu'y a-t-il juste avant et juste après</td><td>Une recherche sur la même machine, cinq minutes autour</td></tr>
<tr><td>5. Et alors ? Est-ce attendu</td><td>Les tickets, les tâches planifiées, les habitudes du service</td></tr></table>
<p><b>Exemple.</b> Trois échecs d'ouverture de session sur PC-RH-02 à 8 h 31, type 2, sous-statut <code>0xc000006a</code>, puis un succès à 8 h 32 sur la même machine. Type 2 veut dire au clavier. Le sous-statut veut dire mauvais mot de passe. Un succès suit. C'est une utilisatrice qui se trompe de mot de passe au retour du week-end, vrai positif bénin.</p>`},
{t:'Mesurer un SOC',h:`
<table class="t"><tr><th>Indicateur</th><th>Sens</th><th>Ce qu'il dit</th></tr>
<tr><td>MTTD</td><td>Temps moyen entre le début d'une attaque et sa détection</td><td>La qualité des sources et des règles</td></tr>
<tr><td>MTTR</td><td>Temps moyen entre la détection et le confinement</td><td>La qualité des procédures et des outils de réponse</td></tr>
<tr><td>Taux de faux positifs</td><td>Part des alertes qui ne demandaient rien</td><td>La fatigue de l'équipe, donc le risque de rater la vraie</td></tr>
<tr><td>Couverture ATT&CK</td><td>Techniques pour lesquelles une détection existe et a été testée</td><td>Les angles morts</td></tr></table>
<p><b>Cas réel, fin 2013.</b> Lors du vol des données de cartes bancaires de l'enseigne américaine Target, l'outil de détection installé quelques mois plus tôt avait levé des alertes sur le logiciel malveillant. Elles ont été vues par l'équipe de surveillance, sans être traitées à temps. Environ 40 millions de cartes ont été dérobées. L'outil avait fait son travail, le processus de tri non.</p>
<div class="encadre retenir"><b>À retenir</b> Trop d'alertes tue l'alerte. Chaque règle bruyante corrigée rend plus visible la seule alerte qui compte.</div>`}
]},
{id:'c2',num:'02',titre:'Le SIEM',obj:['Expliquer ce que fait un SIEM et ce qu\'il ne fait pas','Décrire l\'architecture de Wazuh et le chemin d\'un journal','Chercher efficacement avec DQL dans les alertes et les archives'],sections:[
{t:'À quoi sert un SIEM',h:`
<p class="intro">Un SIEM, Security Information and Event Management, reçoit les journaux de tout le système d'information, les met dans un format commun, les compare à des règles, lève des alertes et permet de chercher dans l'historique.</p>
<table class="t"><tr><th>Fonction</th><th>Ce que cela veut dire</th><th>Chez Orbitale</th></tr>
<tr><td>Collecter</td><td>Recevoir les journaux des machines, réseaux, applications</td><td>Un agent Wazuh sur chaque machine, le fichier eve.json de Suricata</td></tr>
<tr><td>Normaliser</td><td>Découper chaque journal en champs nommés</td><td><code>win.eventdata.commandLine</code>, <code>data.srcip</code></td></tr>
<tr><td>Corréler</td><td>Relier plusieurs événements, compter, comparer</td><td>Huit échecs SSH en deux minutes depuis la même adresse</td></tr>
<tr><td>Alerter</td><td>Donner un niveau et une description</td><td>Règle 5712, niveau 10</td></tr>
<tr><td>Conserver et chercher</td><td>Garder l'historique et l'interroger</td><td>Index wazuh-alerts et wazuh-archives</td></tr></table>
<p>Les SIEM du marché les plus répandus sont Splunk, IBM QRadar, Microsoft Sentinel et Elastic Security. Wazuh est libre et gratuit. Il est né d'OSSEC et ajoute à la partie SIEM un véritable HIDS.</p>
<div class="encadre piege"><b>Piège</b> Un SIEM ne voit que ce qu'on lui envoie. Une machine sans agent, un journal non collecté ou une heure fausse font des trous dans l'enquête, sans aucun message d'erreur.</div>`},
{t:'L\'architecture de Wazuh et le chemin d\'un journal',h:`<div class="schema" data-schema="journal"></div>
<table class="t"><tr><th>Composant</th><th>Rôle</th><th>Port</th></tr>
<tr><td>Agent</td><td>Lit les journaux de la machine, surveille ses fichiers et sa configuration, envoie tout au serveur</td><td>1514 en TCP vers le serveur, 1515 pour l'enrôlement</td></tr>
<tr><td>Serveur, ou manager</td><td>Décode, applique les règles, déclenche les réponses actives et les intégrations</td><td>55000 pour son API</td></tr>
<tr><td>Indexeur</td><td>Stocke les alertes et les archives, répond aux recherches. C'est un OpenSearch</td><td>9200</td></tr>
<tr><td>Tableau de bord</td><td>L'interface web de l'analyste</td><td>443</td></tr></table>
<p>Une machine qui ne parle plus au serveur passe au statut <code>disconnected</code> après quelques minutes sans message de vie. Le tableau de bord l'affiche dans Agents management, onglet Summary.</p>`},
{t:'Alertes et archives',h:`
<p class="intro">Wazuh analyse tous les événements, mais n'en indexe qu'une partie.</p>
<p>Par défaut, seuls les événements qui ont produit une alerte de niveau 3 ou plus vont dans l'index <code>wazuh-alerts-*</code>. Tout le reste est analysé puis jeté. Pour garder aussi les événements sans alerte, on active <code>logall_json</code> dans la configuration du serveur, et on crée le motif d'index <code>wazuh-archives-*</code>. Orbitale l'a fait.</p>
<table class="t"><tr><th>Index</th><th>Contenu</th><th>Où le lire</th></tr>
<tr><td><code>wazuh-alerts-*</code></td><td>Les alertes de niveau 3 et plus</td><td>Threat Hunting, et tous les modules</td></tr>
<tr><td><code>wazuh-archives-*</code></td><td>Tous les événements, avec ou sans alerte</td><td>Explore, Discover, en choisissant ce motif d'index</td></tr></table>
<p><b>Exemple.</b> Une connexion réseau Sysmon (événement 3) vers Microsoft 365 a le niveau 0 : elle n'apparaît que dans les archives. C'est normal, il y en a des centaines par heure. Mais une connexion régulière, toutes les deux minutes, vers un domaine inconnu ne se voit qu'en cherchant dans les archives.</p>
<div class="encadre retenir"><b>À retenir</b> Les alertes disent ce que les règles ont reconnu. Les archives disent tout ce qui s'est passé. La chasse aux menaces se fait dans les archives.</div>`},
{t:'Les niveaux de règle',h:`
<table class="t"><tr><th>Niveau</th><th>Sens dans Wazuh</th><th>Groupe du tableau de bord</th></tr>
<tr><td>0</td><td>Ignoré, aucune alerte</td><td rowspan="3">Low, de 0 à 6</td></tr>
<tr><td>2 à 4</td><td>Notification système, faible importance</td></tr>
<tr><td>5 à 6</td><td>Erreur ou échec d'un utilisateur</td></tr>
<tr><td>7 à 9</td><td>Événement inhabituel, première attaque possible</td><td>Medium, de 7 à 11</td></tr>
<tr><td>10 à 11</td><td>Répétitions, erreurs en rafale</td><td>Medium</td></tr>
<tr><td>12 à 14</td><td>Événement important, attaque probable</td><td>High, de 12 à 14</td></tr>
<tr><td>15</td><td>Attaque réussie, à traiter immédiatement</td><td>Critical, 15</td></tr></table>
<p>Le niveau dit la gravité supposée par l'auteur de la règle, jamais la gravité réelle. Une règle de niveau 12 qui se déclenche sur une sauvegarde planifiée reste une sauvegarde planifiée.</p>`},
{t:'Chercher dans le SIEM',h:`
<p class="intro">Le tableau de bord de Wazuh se cherche avec DQL, le langage de requête des tableaux de bord OpenSearch.</p>
<table class="t"><tr><th>Écriture</th><th>Sens</th><th>Exemple</th></tr>
<tr><td><code>champ: valeur</code></td><td>Égalité</td><td><code>agent.name: PC-RH-02</code></td></tr>
<tr><td><code>champ: debut*</code></td><td>Joker</td><td><code>win.eventdata.image: *powershell*</code></td></tr>
<tr><td><code>champ &gt;= n</code></td><td>Comparaison de nombres</td><td><code>rule.level &gt;= 12</code></td></tr>
<tr><td><code>and</code>, <code>or</code>, <code>not</code></td><td>Combiner</td><td><code>rule.groups: sysmon and not agent.name: SRV-CAO-01</code></td></tr>
<tr><td><code>"texte avec espaces"</code></td><td>Valeur exacte</td><td><code>rule.description: "Windows Logon Success."</code></td></tr>
<tr><td>Un mot seul</td><td>Recherche dans tout le document</td><td><code>rclone</code></td></tr></table>
<p><b>Pivoter.</b> Dans le détail d'un document, le bouton en face d'un champ ajoute ce champ à la requête. On part d'une alerte, on clique sur le processus, puis sur l'empreinte, puis sur la machine, et on suit le fil.</p>
<div class="encadre piege"><b>Piège</b> Dans Windows, les chemins contiennent des barres obliques inversées. Pour chercher un exécutable, le joker sur le nom seul est plus sûr que le chemin complet.</div>`}
]},
{id:'c3',num:'03',titre:'Les sources de journaux',obj:['Savoir quelles sources une détection exige','Lire les événements Windows de sécurité essentiels','Exploiter Sysmon pour suivre processus, fichiers, registre et réseau'],sections:[
{t:'Sans source, pas de détection',h:`
<p class="intro">Une règle ne peut détecter que ce qu'une source a écrit. Le premier travail d'un SOC est de choisir ses sources.</p>
<table class="t"><tr><th>Source</th><th>Ce qu'elle voit</th><th>Ce qu'elle ne voit pas</th></tr>
<tr><td>Journal Security de Windows</td><td>Ouvertures de session, privilèges, comptes, services</td><td>La ligne de commande des processus, sauf réglage particulier</td></tr>
<tr><td>Sysmon</td><td>Processus avec ligne de commande et empreinte, connexions, fichiers, registre, accès à la mémoire</td><td>Le contenu des fichiers et des flux</td></tr>
<tr><td>Journaux Linux</td><td>sshd, sudo, services</td><td>Ce qui se passe dans les applications non journalisées</td></tr>
<tr><td>Pare-feu</td><td>Qui parle à qui, sur quel port, accepté ou bloqué</td><td>Ce qui circule à l'intérieur d'une même zone</td></tr>
<tr><td>IDS</td><td>Les attaques connues dans le trafic</td><td>Le trafic chiffré, sauf ses métadonnées</td></tr></table>
<p>Toutes les machines d'Orbitale prennent leur heure sur DC-01 par NTP. Sans cela, l'ordre des événements entre deux machines ne veut plus rien dire.</p>`},
{t:'Les événements Windows à connaître',h:`
<table class="t"><tr><th>Identifiant</th><th>Sens</th><th>Champs utiles</th></tr>
<tr><td>4624</td><td>Ouverture de session réussie</td><td><code>targetUserName</code>, <code>logonType</code>, <code>ipAddress</code>, <code>authenticationPackageName</code></td></tr>
<tr><td>4625</td><td>Échec d'ouverture de session</td><td><code>status</code>, <code>subStatus</code></td></tr>
<tr><td>4672</td><td>Privilèges spéciaux attribués à la session</td><td><code>privilegeList</code></td></tr>
<tr><td>4688</td><td>Création de processus, si l'audit est activé</td><td><code>newProcessName</code></td></tr>
<tr><td>7045</td><td>Nouveau service installé, journal System</td><td><code>serviceName</code>, <code>imagePath</code>, <code>accountName</code></td></tr>
<tr><td>1102</td><td>Journal de sécurité effacé</td><td>Toujours suspect</td></tr></table>
<table class="t"><tr><th>Type de session</th><th>Sens</th><th>Exemple</th></tr>
<tr><td>2</td><td>Interactive, au clavier</td><td>Un utilisateur ouvre sa session le matin</td></tr>
<tr><td>3</td><td>Réseau</td><td>Accès à un partage, à un service à distance</td></tr>
<tr><td>4</td><td>Traitement par lots</td><td>Une tâche planifiée qui tourne sous un compte de service</td></tr>
<tr><td>5</td><td>Service</td><td>Un service Windows qui démarre</td></tr>
<tr><td>10</td><td>Bureau à distance</td><td>Une session RDP</td></tr></table>
<p>Codes d'échec fréquents de 4625 : <code>0xc000006a</code> mauvais mot de passe, <code>0xc0000064</code> compte inconnu, <code>0xc0000234</code> compte verrouillé.</p>
<div class="encadre piege"><b>Piège</b> Une session de type 3 en NTLM d'un compte de service, depuis un poste utilisateur, est banale à l'œil et très parlante pour qui connaît le compte. Un compte de sauvegarde ne s'ouvre pas depuis le poste d'une acheteuse.</div>`},
{t:'Sysmon, l\'œil sur les processus',h:`
<p class="intro">Sysmon est un outil gratuit de Microsoft, de la suite Sysinternals. Installé comme un service, il écrit dans son propre journal des événements bien plus riches que ceux de Windows.</p>
<table class="t"><tr><th>Événement</th><th>Sens</th><th>Champs utiles</th></tr>
<tr><td>1</td><td>Processus créé</td><td><code>image</code>, <code>commandLine</code>, <code>parentImage</code>, <code>user</code>, <code>hashes</code></td></tr>
<tr><td>3</td><td>Connexion réseau</td><td><code>destinationIp</code>, <code>destinationPort</code>, <code>image</code></td></tr>
<tr><td>10</td><td>Un processus ouvre un autre processus</td><td><code>sourceImage</code>, <code>targetImage</code>, <code>grantedAccess</code></td></tr>
<tr><td>11</td><td>Fichier créé</td><td><code>targetFilename</code>, <code>image</code></td></tr>
<tr><td>13</td><td>Valeur de registre écrite</td><td><code>targetObject</code>, <code>details</code></td></tr>
<tr><td>22</td><td>Requête DNS</td><td><code>queryName</code>, <code>queryResults</code></td></tr></table>
<p>Exemple d'événement 1, tel que le décodeur de Wazuh le présente, sur le poste de l'administrateur.</p>
<pre>{
  "win": {
    "system": { "eventID": "1", "channel": "Microsoft-Windows-Sysmon/Operational" },
    "eventdata": {
      "image": "C:\\Windows\\System32\\whoami.exe",
      "commandLine": "whoami /groups",
      "parentImage": "C:\\Windows\\System32\\cmd.exe",
      "user": "ORBITALE\\kbenali"
    }
  }
}</pre>
<p><b>Le codage de PowerShell.</b> L'option <code>-enc</code> de PowerShell accepte une commande écrite en Base64. Ce Base64 ne code pas un texte ordinaire, mais un texte en UTF-16LE : chaque caractère prend deux octets, le second étant souvent nul. Pour lire la commande, on décode le Base64, puis l'UTF-16LE. Les attaquants l'utilisent pour cacher une commande aux yeux et aux filtres simples.</p>
<div class="encadre retenir"><b>À retenir</b> Le couple parent et enfant est la donnée la plus parlante de Sysmon. Word qui lance PowerShell, un service qui lance un archiveur, un outil d'administration lancé depuis AppData : la chaîne raconte l'attaque.</div>`},
{t:'Les journaux Linux, réseau et applicatifs',h:`
<p>Sur WEB-DMZ-01, Wazuh lit le journal du système par journald, où <code>sshd</code> écrit ses messages. Une tentative avec un compte qui n'existe pas ressemble à ceci.</p>
<pre>web-dmz-01 sshd[2418]: Invalid user oracle from 203.0.113.66 port 51128</pre>
<p>Le décodeur <code>sshd</code> en tire <code>srcip</code> et <code>srcuser</code>. La règle 5710 reconnaît ce message, la règle 5712 compte ces messages et lève une alerte de force brute quand ils se répètent depuis la même adresse.</p>
<p>Suricata écrit ses alertes en JSON dans <code>/var/log/suricata/eve.json</code>. L'agent Wazuh de la sonde lit ce fichier, et chaque alerte de Suricata devient une alerte Wazuh de la règle 86601, avec les champs <code>data.alert.signature</code>, <code>data.src_ip</code>, <code>data.dest_ip</code>.</p>`}
]},
{id:'c4',num:'04',titre:'Écrire une règle',obj:['Lire et écrire une règle Wazuh en XML','Placer une règle dans l\'arbre avec if_sid','Tester avec wazuh-logtest et réduire le bruit'],sections:[
{t:'La structure d\'une règle Wazuh',h:`
<p class="intro">Une règle Wazuh est un bloc XML. Elle dit à quel événement elle s'applique, ce qu'elle exige, quel niveau elle donne et comment elle se présente.</p>
<pre>&lt;group name="local,orbitale,"&gt;
  &lt;rule id="100100" level="12"&gt;
    &lt;if_sid&gt;61603&lt;/if_sid&gt;
    &lt;field name="win.eventdata.parentImage" type="pcre2"&gt;(?i)\\\\winword\\.exe$&lt;/field&gt;
    &lt;field name="win.eventdata.image" type="pcre2"&gt;(?i)\\\\powershell\\.exe$&lt;/field&gt;
    &lt;description&gt;Word a lancé PowerShell sur $(win.system.computer)&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1059.001&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre>
<table class="t"><tr><th>Balise</th><th>Rôle</th></tr>
<tr><td><code>group</code></td><td>Range les règles et leur donne des groupes, ici local et orbitale</td></tr>
<tr><td><code>rule id level</code></td><td>Identifiant unique et niveau de 0 à 15. Les règles locales prennent les numéros 100000 à 120000</td></tr>
<tr><td><code>if_sid</code></td><td>La règle n'est essayée que si la règle parente s'est déclenchée</td></tr>
<tr><td><code>field</code></td><td>Exige qu'un champ décodé corresponde à une expression régulière. <code>negate="yes"</code> inverse le test</td></tr>
<tr><td><code>match</code>, <code>regex</code></td><td>Cherchent dans le journal brut</td></tr>
<tr><td><code>description</code></td><td>Le texte de l'alerte. <code>$(champ)</code> y insère une valeur</td></tr>
<tr><td><code>mitre</code></td><td>La ou les techniques ATT&CK</td></tr>
<tr><td><code>frequency</code>, <code>timeframe</code>, <code>if_matched_sid</code></td><td>Comptent plusieurs déclenchements d'une règle dans un délai</td></tr></table>
<p>Dans une expression <code>pcre2</code>, <code>(?i)</code> ignore la casse, <code>\\\\</code> désigne une barre oblique inversée, <code>\\.</code> un point, <code>$</code> la fin du texte.</p>`},
{t:'L\'arbre des règles',h:`<div class="schema" data-schema="regles"></div>
<p>Wazuh ne teste pas toutes les règles sur chaque événement. Il part des règles racines, celles qui n'ont pas de <code>if_sid</code>, puis descend vers les filles de la règle qui a correspondu. L'événement prend la règle la plus profonde qui correspond.</p>
<p>Pour qu'une règle locale soit essayée, il faut donc l'accrocher sous la bonne règle parente. Une règle sur l'événement Sysmon 10 s'accroche sous 61612, la règle qui reconnaît cet événement. Accrochée sous 61603, elle ne serait jamais essayée sur un accès mémoire.</p>
<div class="encadre piege"><b>Piège</b> Une règle locale trop large se déclenche partout et noie la console. Avant d'enregistrer, demandez-vous : sur quoi d'autre cette règle va-t-elle se déclencher ce matin ?</div>`},
{t:'Tester avant de déployer',h:`
<p>L'outil <code>wazuh-logtest</code>, en ligne de commande sur le serveur ou dans Server management, Ruleset Test, rejoue un journal dans le jeu de règles et affiche les trois phases.</p>
<pre>**Phase 1: Completed pre-decoding.
**Phase 2: Completed decoding.
        name: 'windows_eventchannel'
**Phase 3: Completed filtering (rules).
        id: '100200'
        level: '15'
**Alert to be generated.</pre>
<p>Dans ce simulateur, le bouton de rejeu passe toutes les archives de la matinée dans votre nouveau jeu de règles et liste ce que chaque règle locale aurait levé. C'est ce que fait une équipe de détection quand elle rejoue des journaux enregistrés avant de mettre une règle en production.</p>
<p>Après un enregistrement sur un vrai serveur, il faut redémarrer le gestionnaire pour que le nouveau jeu de règles s'applique : <code>systemctl restart wazuh-manager</code>, ou le bouton du tableau de bord.</p>`},
{t:'Du bruit à la détection',h:`
<p class="intro">Écrire une règle prend dix minutes. La rendre utile prend des semaines.</p>
<table class="t"><tr><th>Technique</th><th>Exemple</th></tr>
<tr><td>Exception par champ</td><td>Une fille de niveau 0 qui reconnaît la tâche de sauvegarde par son parent et son compte</td></tr>
<tr><td>Restreindre la source</td><td><code>ipAddress</code> dans la plage des postes et pas ailleurs</td></tr>
<tr><td>Compter</td><td>Dix échecs en deux minutes plutôt qu'un seul</td></tr>
<tr><td>Élever le niveau d'une combinaison</td><td>Un outil d'archivage lancé par un service inconnu</td></tr></table>
<div class="encadre retenir"><b>À retenir</b> Une bonne règle se déclenche sur l'attaque et sur rien d'autre. Le rejeu des archives est la façon la plus sûre de le vérifier.</div>`}
]},
{id:'c5',num:'05',titre:'La sonde HIDS',obj:['Distinguer HIDS et NIDS','Utiliser le contrôle d\'intégrité, l\'évaluation de configuration et la détection de vulnérabilités','Comprendre la réponse active et ses limites'],sections:[
{t:'HIDS et NIDS',h:`
<p class="intro">Un HIDS surveille une machine de l'intérieur. Un NIDS surveille le réseau. Les deux se complètent.</p>
<table class="t"><tr><th></th><th>HIDS</th><th>NIDS</th></tr>
<tr><td>Où</td><td>Sur la machine, par un agent</td><td>Sur un lien réseau, souvent au pare-feu</td></tr>
<tr><td>Voit</td><td>Fichiers, registre, journaux, configuration, processus</td><td>Paquets, flux, protocoles</td></tr>
<tr><td>Aveugle à</td><td>Les machines sans agent</td><td>Le trafic chiffré, ce qui ne passe pas par la sonde</td></tr>
<tr><td>Exemple libre</td><td>Wazuh, issu d'OSSEC</td><td>Suricata, Snort, Zeek</td></tr></table>
<p>Wazuh est d'abord un HIDS. Son agent fait bien plus que transmettre des journaux : il calcule les empreintes des fichiers, compare la configuration à un guide, inventorie les logiciels et peut agir sur la machine.</p>`},
{t:'L\'intégrité des fichiers',h:`<div class="schema" data-schema="fim"></div>
<p>Le module FIM, File Integrity Monitoring, garde pour chaque fichier surveillé son empreinte, sa taille, son propriétaire et ses droits. En mode <code>realtime</code>, il signale un ajout, une modification ou une suppression dans la seconde.</p>
<table class="t"><tr><th>Événement</th><th>Règle Wazuh</th><th>Exemple</th></tr>
<tr><td>added</td><td>554</td><td>Un exécutable apparaît dans AppData Roaming</td></tr>
<tr><td>modified</td><td>550</td><td>La configuration du site web change</td></tr>
<tr><td>deleted</td><td>553</td><td>Un fichier de travail disparaît quelques minutes après sa création</td></tr>
<tr><td>Valeur de registre ajoutée</td><td>752</td><td>Une nouvelle entrée dans la clé Run</td></tr></table>
<p>Une empreinte SHA256 est une suite de 64 caractères calculée à partir du contenu. Un octet changé donne une empreinte totalement différente. Deux fichiers de même empreinte sont le même fichier, quels que soient leurs noms. C'est ce qui permet de retrouver un fichier malveillant renommé sur une autre machine, ou de le soumettre à VirusTotal sans l'envoyer.</p>
<div class="encadre piege"><b>Piège</b> Un fichier créé puis supprimé quelques minutes plus tard est une trace typique d'attaquant qui nettoie derrière lui. La suppression n'efface pas l'alerte d'ajout, ni son empreinte.</div>`},
{t:'L\'évaluation de configuration',h:`
<p>Le module SCA, Security Configuration Assessment, compare la configuration de chaque machine à un guide, le plus souvent un guide du CIS, Center for Internet Security. Chaque contrôle est réussi ou échoué, avec sa justification et sa correction.</p>
<table class="t"><tr><th>Contrôle</th><th>Pourquoi il compte</th></tr>
<tr><td>LSASS en processus protégé, RunAsPPL</td><td>Empêche un processus, même administrateur, de lire la mémoire où sont les secrets de session</td></tr>
<tr><td>Utilisateur hors du groupe Administrateurs local</td><td>Ce que lance l'utilisateur, une pièce jointe par exemple, n'a pas les droits élevés</td></tr>
<tr><td>Macros des fichiers venus d'Internet bloquées</td><td>Le document piégé ne peut pas lancer sa macro</td></tr>
<tr><td>LAPS</td><td>Un mot de passe d'administrateur local différent sur chaque poste</td></tr>
<tr><td>Système encore maintenu par l'éditeur</td><td>Un système en fin de support ne reçoit plus de correctif</td></tr></table>
<p><b>Méthode.</b> Comparer deux machines du même service est la façon la plus rapide de trouver ce qui manque à l'une. Un poste réinstallé en urgence garde souvent les réglages par défaut.</p>`},
{t:'Les vulnérabilités',h:`
<p>Le module Vulnerability Detection de Wazuh inventorie les logiciels et le système de chaque agent, puis les compare aux bases de vulnérabilités publiques. Chaque vulnérabilité porte un identifiant CVE et un score CVSS de 0 à 10.</p>
<table class="t"><tr><th>Score CVSS</th><th>Sévérité</th></tr>
<tr><td>9,0 à 10</td><td>Critical</td></tr><tr><td>7,0 à 8,9</td><td>High</td></tr><tr><td>4,0 à 6,9</td><td>Medium</td></tr><tr><td>0,1 à 3,9</td><td>Low</td></tr></table>
<p><b>Cas réel, juillet 2024.</b> La vulnérabilité CVE-2024-6387, surnommée regreSSHion, touchait le serveur OpenSSH des distributions Linux à base de glibc. Une condition de course dans le traitement d'un signal permettait l'exécution de code à distance sans authentification. Tous les serveurs SSH exposés à Internet devaient être corrigés en urgence.</p>
<p><b>Cas réel, octobre 2025.</b> Windows 10 a atteint sa fin de support le 14 octobre 2025. Un poste resté sous Windows 10 sans le programme de mises à jour de sécurité étendues ne reçoit plus aucun correctif. Dans une usine, ce sont souvent les postes de pilotage des machines, qui ne peuvent pas être migrés sans le constructeur.</p>`},
{t:'La réponse active',h:`
<p>Wazuh peut agir quand une règle se déclenche. La réponse <code>firewall-drop</code> ajoute l'adresse source dans le pare-feu local de la machine pour une durée donnée. La règle 651 signale que la réponse a été exécutée.</p>
<pre>&lt;active-response&gt;
  &lt;command&gt;firewall-drop&lt;/command&gt;
  &lt;location&gt;local&lt;/location&gt;
  &lt;rules_id&gt;5712&lt;/rules_id&gt;
  &lt;timeout&gt;600&lt;/timeout&gt;
&lt;/active-response&gt;</pre>
<div class="encadre piege"><b>Piège</b> La réponse active agit sur la machine, pas sur le pare-feu de périmètre. Les paquets de l'attaquant continuent de traverser fw-01, ils sont rejetés à l'arrivée. Pour que l'attaquant ne touche plus du tout le serveur, c'est la règle du pare-feu qu'il faut changer.</div>`}
]}
];

SOC_COURS.push(
{id:'c6',num:'06',titre:'L\'EDR, Elastic Defend',obj:['Distinguer antivirus, HIDS, EDR et XDR','Comprendre Elastic Agent, Fleet et les politiques Detect et Prevent','Lire un arbre de processus dans l\'analyseur','Contenir un poste sans détruire les preuves'],sections:[
{t:'Antivirus, HIDS, EDR, XDR',h:`
<p class="intro">Un EDR, Endpoint Detection and Response, enregistre en continu ce qui se passe sur chaque poste et chaque serveur, reconnaît les comportements d'attaque et permet d'agir à distance sur la machine. Chez Orbitale, c'est Elastic Defend, l'agent EDR de la suite Elastic Security.</p>
<table class="t"><tr><th>Outil</th><th>Question à laquelle il répond</th><th>Chez Orbitale</th></tr>
<tr><td>Antivirus, ou EPP</td><td>Ce fichier ressemble-t-il à un logiciel malveillant connu</td><td>Microsoft Defender Antivirus, présent sur chaque Windows</td></tr>
<tr><td>HIDS</td><td>Qu'est-ce qui a changé sur cette machine, et est-elle bien configurée</td><td>Agent Wazuh, chapitre 05</td></tr>
<tr><td>EDR</td><td>Quel processus a fait quoi, lancé par qui, et comment l'arrêter maintenant</td><td>Elastic Defend</td></tr>
<tr><td>XDR</td><td>La même logique étendue au réseau, à la messagerie, aux identités et au cloud</td><td>Elastic Security, qui réunit les alertes de l'EDR et d'autres sources</td></tr></table>
<p>L'antivirus juge un fichier. L'EDR juge un enchaînement. Un document Word est légitime, PowerShell est légitime, une connexion HTTPS est légitime. Un document Word qui lance PowerShell, qui télécharge un exécutable et l'inscrit au démarrage de la session ne l'est plus. Aucun de ces éléments pris seul n'est un virus, c'est leur suite qui trahit l'attaque.</p>
<p><b>Cas réel, 19 juillet 2024.</b> Une mise à jour de contenu défectueuse du capteur Falcon de CrowdStrike a provoqué l'écran bleu d'environ 8,5 millions de machines Windows, selon l'estimation de Microsoft. Aéroports, hôpitaux, banques et chaînes de télévision ont été arrêtés pendant des heures. Un EDR travaille au plus près du noyau, avec les droits les plus élevés de la machine. Son déploiement et ses mises à jour se pilotent donc par vagues, en commençant par un petit groupe de machines de test.</p>
<div class="encadre retenir"><b>À retenir</b> Un EDR voit plus qu'un antivirus, mais il est aussi plus dangereux s'il se trompe. Il se déploie progressivement, et chaque blocage automatique se décide en connaissant le métier de la machine.</div>`},
{t:'Elastic Agent, Fleet et les politiques',h:`
<p class="intro">Elastic Defend n'est pas un logiciel à part. C'est une intégration ajoutée à Elastic Agent, l'agent unique de la suite Elastic, et pilotée depuis Kibana par Fleet.</p>
<table class="t"><tr><th>Brique</th><th>Rôle</th></tr>
<tr><td>Elastic Agent</td><td>Le service installé sur la machine. Il reçoit sa politique et envoie les événements</td></tr>
<tr><td>Fleet</td><td>La gestion centrale des agents dans Kibana : inscription, politiques, versions, état</td></tr>
<tr><td>Politique d'agent</td><td>L'ensemble des intégrations et réglages appliqués à un groupe d'agents</td></tr>
<tr><td>Intégration Elastic Defend</td><td>La partie EDR de la politique : protections, événements collectés, exceptions</td></tr>
<tr><td>Jeton d'inscription</td><td>La clé donnée à l'installation. Il rattache le nouvel agent à une politique précise</td></tr></table>
<p>Dans Elastic Defend, chaque protection a trois positions : Off, Detect ou Prevent.</p>
<table class="t"><tr><th>Protection</th><th>Ce qu'elle surveille</th></tr>
<tr><td>Malware</td><td>Les fichiers exécutés ou écrits, comparés à un modèle d'apprentissage automatique et à des signatures</td></tr>
<tr><td>Ransomware</td><td>Les écritures massives et le chiffrement de fichiers</td></tr>
<tr><td>Memory threat</td><td>Le code injecté dans la mémoire d'un autre processus</td></tr>
<tr><td>Malicious behavior</td><td>Les enchaînements d'actions, décrits par des règles de comportement</td></tr></table>
<p>En position Detect, Elastic Defend lève une alerte et laisse faire. En position Prevent, il lève une alerte et arrête le processus, met le fichier en quarantaine ou empêche l'action. Le titre de l'alerte le dit : <code>Malicious Behavior Detection Alert</code> dans un cas, <code>Malicious Behavior Prevention Alert</code> dans l'autre.</p>
<div class="schema" data-schema="edrpol"></div>
<p>Orbitale utilise deux politiques. <b>Orbitale Postes Prevent</b> bloque, elle s'applique au parc. <b>Onboarding Detect</b> ne bloque rien, elle accueille les machines fraîchement installées, le temps d'ajuster les exceptions. Le jeton d'inscription remis au support pointe vers Onboarding Detect.</p>
<div class="encadre piege"><b>Piège</b> Une machine réinstallée repart avec le jeton d'inscription, donc avec la politique d'accueil. Si personne ne la bascule ensuite, elle reste en Detect pour toujours. Sur la console elle est verte, elle remonte des alertes, et elle ne bloque rien. Comparez toujours la politique de deux postes qui n'ont pas réagi pareil.</div>
<table class="t"><tr><th>Champ ECS d'Elastic</th><th>Équivalent Sysmon dans Wazuh</th></tr>
<tr><td><code>host.name</code></td><td><code>agent.name</code></td></tr>
<tr><td><code>process.executable</code></td><td><code>win.eventdata.image</code></td></tr>
<tr><td><code>process.parent.executable</code></td><td><code>win.eventdata.parentImage</code></td></tr>
<tr><td><code>process.command_line</code></td><td><code>win.eventdata.commandLine</code></td></tr>
<tr><td><code>process.hash.sha256</code></td><td><code>win.eventdata.hashes</code></td></tr>
<tr><td><code>user.name</code></td><td><code>win.eventdata.user</code></td></tr></table>
<p>ECS, Elastic Common Schema, est le dictionnaire des noms de champs d'Elastic. Connaître les deux noms d'un même champ permet de passer d'une console à l'autre sans perdre le fil.</p>`},
{t:'Lire un arbre de processus',h:`
<p class="intro">L'analyseur d'Elastic Security, ouvert depuis une alerte par Analyze event, dessine la famille du processus en cause : ses parents, ses enfants, et ce que chacun a fait.</p>
<div class="schema" data-schema="arbre"></div>
<p>L'arbre se lit de haut en bas. Chaque processus a un parent. Une chaîne normale ressemble à <code>explorer.exe</code> qui lance <code>WINWORD.EXE</code>. Une chaîne suspecte ressemble à <code>WINWORD.EXE</code> qui lance <code>powershell.exe</code>. En cliquant un nœud, l'analyseur liste ses événements : fichiers écrits, clés de registre, connexions réseau, bibliothèques chargées.</p>
<table class="t"><tr><th>Indice</th><th>Pourquoi c'est suspect</th></tr>
<tr><td>Parent inattendu</td><td>Word, Excel ou Outlook n'ont aucune raison de lancer un interpréteur de commandes</td></tr>
<tr><td>Ligne de commande encodée</td><td><code>-enc</code> ou <code>-EncodedCommand</code> cache le script en Base64</td></tr>
<tr><td>Fenêtre cachée</td><td><code>-w hidden</code> ou <code>-WindowStyle Hidden</code>, l'utilisateur ne voit rien</td></tr>
<tr><td>Exécutable dans AppData ou ProgramData</td><td>Les logiciels légitimes s'installent dans Program Files, avec les droits d'administrateur</td></tr>
<tr><td>Nom qui imite un nom système</td><td>syncsvc.exe, svch0st.exe, une valeur Run nommée OneDriveSync</td></tr>
<tr><td>Accès à lsass.exe</td><td>LSASS garde les secrets des sessions ouvertes. Le champ <code>grantedAccess</code> de l'événement Sysmon 10 dit quels droits ont été demandés</td></tr></table>
<p>Pour lire la mémoire de LSASS, l'attaquant n'a pas toujours besoin d'apporter un outil. Windows contient des programmes signés par Microsoft qui savent écrire la mémoire d'un processus dans un fichier, ou télécharger et lancer du code : <code>rundll32.exe</code>, <code>certutil.exe</code>, <code>mshta.exe</code>, <code>regsvr32.exe</code>. Les utiliser à contre-emploi s'appelle vivre sur le terrain, Living off the Land. Le projet public LOLBAS les recense avec leurs détournements connus.</p>
<p class="note">Le schéma ci-dessus est un exemple d'école, hors du scénario d'Orbitale. À vous de retrouver la vraie chaîne de la matinée dans l'analyseur.</p>
<div class="encadre retenir"><b>À retenir</b> Remontez toujours l'arbre jusqu'au premier processus anormal. C'est lui qui donne le point d'entrée, l'heure de départ et le compte de l'utilisateur.</div>`},
{t:'Contenir depuis la console de réponse',h:`
<p class="intro">Repérer ne suffit pas. L'EDR sert aussi à agir, vite et sans se déplacer, pendant que l'attaquant est encore là.</p>
<table class="t"><tr><th>Commande de la console</th><th>Effet</th></tr>
<tr><td><code>isolate</code></td><td>Coupe la machine du réseau. Seule la liaison avec Elastic reste ouverte</td></tr>
<tr><td><code>release</code></td><td>Lève l'isolement</td></tr>
<tr><td><code>processes</code></td><td>Liste les processus en cours, avec leur numéro PID</td></tr>
<tr><td><code>kill-process --pid 6112</code></td><td>Termine un processus</td></tr>
<tr><td><code>suspend-process --pid 6112</code></td><td>Gèle un processus sans le tuer, sa mémoire reste lisible</td></tr>
<tr><td><code>get-file --path C:\\chemin\\fichier</code></td><td>Rapatrie un fichier dans une archive protégée par mot de passe</td></tr>
<tr><td><code>status</code></td><td>Donne l'état de l'agent et de l'isolement</td></tr></table>
<p>Chaque commande accepte <code>--comment</code>, qui s'inscrit dans l'historique des actions de réponse. Cet historique est une preuve : qui a agi, quand, sur quelle machine, pourquoi.</p>
<p>La liste de blocage, Blocklist, interdit l'exécution d'un fichier par son empreinte SHA256 sur toutes les machines d'une politique. Elle empêche un nouveau lancement, elle ne touche pas un processus déjà en cours.</p>
<ol class="grand"><li><b>Isoler</b> L'attaquant perd la main, la machine reste allumée</li>
<li><b>Préserver</b> Rapatrier les fichiers utiles, noter les PID et les heures</li>
<li><b>Arrêter</b> Suspendre ou tuer les processus malveillants</li>
<li><b>Empêcher le retour</b> Bloquer l'empreinte, retirer la persistance, changer la politique</li>
<li><b>Documenter</b> Chaque action avec son commentaire et son heure dans la main courante</li></ol>
<div class="encadre piege"><b>Piège</b> Tuer un processus ne supprime pas sa persistance. Si une valeur Run du registre le relance à l'ouverture de session, il reviendra au prochain démarrage. Et éteindre la machine détruit la mémoire, donc des preuves comme la trace des identifiants volés.</div>
<p class="note">Dans Elastic, les actions de réponse font partie des abonnements payants. L'essai gratuit de 30 jours les ouvre toutes, ce qui suffira pour le TP réel.</p>`}
]},
{id:'c7',num:'07',titre:'Pare-feu et IDS',obj:['Lire et ordonner les règles d\'un pare-feu à états','Filtrer les flux sortants sans casser le métier','Comprendre la traduction d\'adresses et l\'exposition de la DMZ','Lire une signature Suricata et trier ses alertes'],sections:[
{t:'fw-01 et ses règles',h:`
<p class="intro">Le pare-feu fw-01, un OPNsense, sépare les cinq zones d'Orbitale. Il décide quels flux passent de l'une à l'autre et journalise sa décision.</p>
<table class="t"><tr><th>Interface</th><th>Réseau</th><th>Qui s'y trouve</th></tr>
<tr><td>WAN</td><td>203.0.113.10, adresse publique</td><td>Internet</td></tr>
<tr><td>LAN</td><td><code>10.20.0.0/24</code></td><td>Les postes des collaborateurs</td></tr>
<tr><td>SERVEURS</td><td><code>10.10.0.0/24</code></td><td>Contrôleur de domaine, fichiers, CAO, Wazuh, poste d'administration</td></tr>
<tr><td>PROD</td><td><code>10.30.0.0/24</code></td><td>L'atelier et ses centres d'usinage</td></tr>
<tr><td>DMZ</td><td><code>172.16.0.0/24</code></td><td>Le site vitrine public</td></tr></table>
<p>Un pare-feu à états se souvient des connexions ouvertes. Quand un poste ouvre une connexion vers Internet, la réponse revient sans qu'il faille une règle pour elle. Il suffit donc d'écrire les règles dans le sens de l'ouverture.</p>
<p>Dans OPNsense, les règles se posent sur l'interface par laquelle le paquet entre dans le pare-feu. Un poste qui va vers un serveur est jugé par les règles de LAN, pas par celles de SERVEURS. Les règles se lisent de haut en bas, la première qui correspond s'applique, les suivantes ne sont pas lues. Ce qui ne correspond à aucune règle est bloqué par défaut.</p>
<div class="schema" data-schema="parefeu"></div>
<p>Une règle se lit en cinq champs : action, protocole, source, destination, port de destination. La notation <code>10.20.0.0/24</code> désigne les 256 adresses de 10.20.0.0 à 10.20.0.255. Le mot <code>any</code> veut dire n'importe laquelle.</p>
<table class="t"><tr><th>Champ du journal</th><th>Sens</th></tr>
<tr><td>Interface</td><td>WAN, LAN, SERVEURS, PROD ou DMZ, là où le paquet est entré</td></tr>
<tr><td>Action</td><td>pass ou block</td></tr>
<tr><td>Source et destination</td><td>Adresses et ports</td></tr>
<tr><td>Étiquette</td><td>La description de la règle qui a décidé, ou blocage par défaut</td></tr>
<tr><td>Octets</td><td>Volume de la connexion, précieux pour repérer une exfiltration</td></tr></table>
<div class="encadre piege"><b>Piège</b> Une règle de blocage posée sous une règle qui autorise tout ne sert à rien. L'ordre compte plus que le contenu. Après chaque modification, testez le flux dans Diagnostics avant de dire que c'est fait.</div>`},
{t:'Filtrer aussi ce qui sort',h:`
<p class="intro">Beaucoup de réseaux filtrent ce qui entre et laissent tout sortir. Or une machine compromise appelle son serveur de commande vers l'extérieur, et une exfiltration est un flux sortant.</p>
<p>Chez Orbitale, les postes ne peuvent sortir qu'en web, ports 80 et 443. C'est bien, mais l'attaquant le sait : son serveur de commande répond justement en HTTPS. Les serveurs, eux, ont une règle qui autorise tout. C'est le point faible : un serveur compromis peut parler à n'importe qui, sur n'importe quel port.</p>
<table class="t"><tr><th>Bonne pratique</th><th>Exemple chez Orbitale</th></tr>
<tr><td>Autoriser ce qui est nécessaire, refuser le reste</td><td>Un serveur n'a besoin de sortir que vers ses mises à jour et quelques partenaires connus</td></tr>
<tr><td>Bloquer les indicateurs connus en tête de chaque interface</td><td>Une règle block vers le serveur de l'attaquant, sur LAN et sur SERVEURS</td></tr>
<tr><td>Dater et justifier chaque dérogation</td><td>La règle provisoire du poste du chef d'atelier vers Microsoft 365</td></tr>
<tr><td>Surveiller le volume</td><td>Un serveur qui envoie 2 Go hors des heures de sauvegarde mérite une question</td></tr></table>
<p>Une dérogation provisoire qui n'a pas de date de fin devient définitive. C'est souvent par elles qu'une zone fermée s'ouvre sur Internet sans que personne ne s'en souvienne.</p>
<p><b>Cas réel, janvier 2024.</b> L'exploitation des passerelles Ivanti Connect Secure, CVE-2023-46805 et CVE-2024-21887, a rappelé que les équipements de bordure sont des cibles de choix. Les équipes qui avaient les journaux du pare-feu et du VPN dans leur SIEM ont pu retrouver les connexions sortantes inhabituelles de ces équipements. Les autres ont dû reconstruire l'histoire à l'aveugle.</p>
<div class="encadre piege"><b>Piège</b> Bloquer toute une plage d'adresses pour aller vite peut couper un service légitime hébergé à côté. Avant de bloquer, cherchez dans le journal du pare-feu qui d'autre parle à cette destination.</div>`},
{t:'L\'IDS Suricata',h:`
<p class="intro">Suricata lit une copie du trafic et le compare à des signatures. En mode IDS il signale, en mode IPS il bloque. Chez Orbitale, il tourne sur fw-01 en mode IDS, avec les signatures ET Open d'Emerging Threats.</p>
<div class="schema" data-schema="ids"></div>
<p>Ses alertes sortent en JSON dans le fichier <code>eve.json</code>. L'agent Wazuh de la sonde le lit, et la règle Wazuh 86601 transforme chaque alerte Suricata en alerte du SIEM. Dans la console EveBox du SOC, les alertes identiques sont regroupées et peuvent être archivées une fois traitées.</p>
<pre>alert http $HOME_NET any -&gt; $EXTERNAL_NET any (msg:"ORBITALE rclone vers Internet"; flow:established,to_server; http.user_agent; content:"rclone/"; startswith; classtype:policy-violation; sid:1000001; rev:1;)</pre>
<table class="t"><tr><th>Partie</th><th>Rôle</th></tr>
<tr><td><code>alert http</code></td><td>L'action et le protocole analysé</td></tr>
<tr><td><code>$HOME_NET any -&gt; $EXTERNAL_NET any</code></td><td>Le sens du flux, du réseau interne vers l'extérieur, tous ports</td></tr>
<tr><td><code>msg</code></td><td>Le texte de l'alerte</td></tr>
<tr><td><code>flow:established,to_server</code></td><td>Seulement dans une connexion établie, dans le sens client vers serveur</td></tr>
<tr><td><code>http.user_agent</code></td><td>Le champ où chercher, ici l'en-tête qui nomme le logiciel client</td></tr>
<tr><td><code>content</code> et <code>startswith</code></td><td>Le motif cherché, en début de champ</td></tr>
<tr><td><code>classtype</code></td><td>La catégorie, qui fixe la gravité par défaut</td></tr>
<tr><td><code>sid</code> et <code>rev</code></td><td>L'identifiant de la signature et sa version. Les règles locales commencent à 1000000</td></tr></table>
<p>Le préfixe du message dit la famille de la signature. <code>ET POLICY</code> signale un usage contraire à une politique, pas forcément une attaque. <code>ET INFO</code> est informatif. <code>ET MALWARE</code> et <code>ET TROJAN</code> désignent un logiciel malveillant connu. <code>ET SCAN</code> signale un balayage.</p>
<div class="encadre piege"><b>Piège</b> Un scanner de vulnérabilités interne déclenche des dizaines de signatures de balayage chaque matin. Il faut le reconnaître, le documenter, puis l'exclure proprement par son adresse plutôt que de couper les signatures. Sinon, le jour où un vrai balayage arrive, personne ne le voit.</div>`},
{t:'Traduction d\'adresses et DMZ',h:`
<p class="intro">Orbitale n'a qu'une adresse publique, 203.0.113.10. Le pare-feu traduit les adresses pour que les machines internes sortent par elle, et pour qu'Internet atteigne le site vitrine sans voir le reste.</p>
<div class="schema" data-schema="nat"></div>
<table class="t"><tr><th>Traduction</th><th>Ce qu'elle fait</th><th>Chez Orbitale</th></tr>
<tr><td>NAT sortant</td><td>Remplace l'adresse privée de la source par l'adresse publique</td><td>Tous les postes et serveurs sortent en 203.0.113.10</td></tr>
<tr><td>Redirection de port</td><td>Envoie ce qui arrive sur un port public vers une machine interne</td><td>203.0.113.10 port 443 vers WEB-DMZ-01, 172.16.0.10</td></tr></table>
<p>Une redirection de port ouvre une porte, la règle WAN qui l'accompagne décide qui peut la franchir. Sur WEB-DMZ-01, la règle HTTPS autorise tout Internet, c'est normal pour un site public. La règle SSH autorise aussi tout Internet, et ce n'est pas normal : seul le prestataire web en a besoin.</p>
<p>La DMZ existe pour une raison simple : un serveur exposé à Internet finira un jour par être attaqué. S'il est compromis, il ne doit rien pouvoir atteindre à l'intérieur. C'est le rôle de la règle DMZ qui bloque tout vers <code>10.0.0.0/8</code>.</p>
<div class="encadre retenir"><b>À retenir</b> Dans les journaux du pare-feu, une connexion entrante montre l'adresse publique d'origine et la machine interne de destination après traduction. Pour savoir qui a vraiment été visé, lisez la destination traduite.</div>`}
]},
{id:'c8',num:'08',titre:'MITRE ATT&CK',obj:['Nommer un comportement avec une tactique et une technique','Raconter une intrusion dans l\'ordre des tactiques','Mesurer la valeur d\'un indicateur avec la pyramide de la douleur'],sections:[
{t:'Nommer ce que l\'on voit',h:`
<p class="intro">MITRE ATT&amp;CK est un référentiel public des comportements d'attaquants observés dans la réalité. Il range les techniques sous les tactiques, c'est-à-dire sous les objectifs de l'attaquant.</p>
<p>MITRE est un organisme américain à but non lucratif. ATT&amp;CK signifie Adversarial Tactics, Techniques and Common Knowledge. La matrice Enterprise compte 14 tactiques. Chaque technique a un identifiant de la forme <code>T1059</code>, et chaque sous-technique ajoute un numéro, <code>T1059.001</code> pour PowerShell.</p>
<table class="t"><tr><th>Tactique</th><th>Technique</th><th>Identifiant</th></tr>
<tr><td>Accès initial</td><td>Pièce jointe piégée</td><td>T1566.001</td></tr>
<tr><td>Exécution</td><td>PowerShell</td><td>T1059.001</td></tr>
<tr><td>Exécution</td><td>Fichier malveillant ouvert par l'utilisateur</td><td>T1204.002</td></tr>
<tr><td>Persistance</td><td>Clés Run du registre</td><td>T1547.001</td></tr>
<tr><td>Découverte</td><td>Comptes du domaine</td><td>T1087.002</td></tr>
<tr><td>Accès aux identifiants</td><td>Mémoire de LSASS</td><td>T1003.001</td></tr>
<tr><td>Mouvement latéral</td><td>Administration à distance par WinRM</td><td>T1021.006</td></tr>
<tr><td>Mouvement latéral</td><td>Partages administratifs SMB</td><td>T1021.002</td></tr>
<tr><td>Collecte</td><td>Archive par un utilitaire</td><td>T1560.001</td></tr>
<tr><td>Exfiltration</td><td>Vers un stockage en ligne</td><td>T1567.002</td></tr>
<tr><td>Commande et contrôle</td><td>Protocoles web</td><td>T1071.001</td></tr></table>
<p>Wazuh ajoute ces identifiants aux alertes dans <code>rule.mitre.id</code>, et Elastic dans <code>threat.technique.id</code>. Les deux consoles savent filtrer par technique, et le module MITRE ATT&amp;CK de Wazuh affiche la matrice avec le nombre d'alertes par case.</p>
<div class="encadre retenir"><b>À retenir</b> Un rapport qui cite les techniques ATT&amp;CK se lit et se compare d'un SOC à l'autre. Une même technique peut apparaître sous deux tactiques, c'est le contexte qui décide.</div>`},
{t:'Raconter l\'attaque dans l\'ordre',h:`
<p class="intro">Une intrusion n'est pas une alerte isolée, c'est une histoire avec un début, un milieu et une fin. Les tactiques donnent le plan de cette histoire.</p>
<div class="schema" data-schema="killchain"></div>
<p>Quand vous reconstruisez une matinée comme celle d'Orbitale, posez chaque constat sur la ligne des tactiques. Les trous apparaissent tout de suite : si vous avez une exfiltration mais pas d'accès initial, il manque le début, et la machine par laquelle tout a commencé n'est peut-être pas celle que vous croyez.</p>
<table class="t"><tr><th>Question</th><th>Tactique qui y répond</th></tr>
<tr><td>Par où sont-ils entrés</td><td>Accès initial</td></tr>
<tr><td>Comment sont-ils restés</td><td>Persistance</td></tr>
<tr><td>Avec quels droits ont-ils avancé</td><td>Accès aux identifiants, élévation de privilèges</td></tr>
<tr><td>Où sont-ils allés</td><td>Découverte, mouvement latéral</td></tr>
<tr><td>Qu'ont-ils pris</td><td>Collecte, exfiltration</td></tr></table>
<div class="encadre piege"><b>Piège</b> L'ordre des tactiques n'est pas toujours l'ordre des heures. Un attaquant peut installer sa persistance après avoir volé des identifiants, ou revenir à la découverte sur chaque nouvelle machine. La chronologie suit l'horloge, le récit suit les tactiques, et le rapport donne les deux.</div>`},
{t:'La pyramide de la douleur',h:`
<p class="intro">Tous les indicateurs ne se valent pas. David Bianco a proposé en 2013 la pyramide de la douleur : plus un indicateur est haut, plus il coûte cher à l'attaquant de le changer.</p>
<table class="t"><tr><th>Niveau</th><th>Indicateur</th><th>Pour l'attaquant, en changer est</th></tr>
<tr><td>6, au sommet</td><td>Comportements, les TTP</td><td>Très difficile, il faut changer sa façon de travailler</td></tr>
<tr><td>5</td><td>Outils</td><td>Difficile, il faut en écrire ou en trouver d'autres</td></tr>
<tr><td>4</td><td>Traces sur la machine et le réseau</td><td>Pénible, chemins, noms de valeurs, en-têtes</td></tr>
<tr><td>3</td><td>Noms de domaine</td><td>Simple, un domaine coûte quelques euros</td></tr>
<tr><td>2</td><td>Adresses IP</td><td>Facile, il change de serveur</td></tr>
<tr><td>1, à la base</td><td>Empreintes de fichiers</td><td>Trivial, un octet modifié suffit</td></tr></table>
<p>Bloquer l'empreinte de syncsvc.exe est utile ce matin. Détecter qu'un document Office lance PowerShell est utile toute l'année, quel que soit le fichier. Une bonne règle vise le haut de la pyramide.</p>
<div class="encadre retenir"><b>À retenir</b> TTP veut dire Tactics, Techniques and Procedures. Une détection écrite sur un comportement survit au changement d'outil de l'attaquant. Une détection écrite sur une empreinte meurt à la prochaine compilation.</div>`}
]},
{id:'c11',num:'09',titre:'Orchestrer avec un SOAR',obj:['Savoir ce qu\'un SOAR automatise et ce qu\'il ne doit pas décider seul','Lire un scénario Shuffle : déclencheur, actions, branches et conditions','Brancher Wazuh sur Shuffle','Automatiser une réponse sans arrêter la production'],sections:[
{t:'Pourquoi automatiser',h:`
<p class="intro">Un SOAR, Security Orchestration, Automation and Response, enchaîne automatiquement les gestes répétitifs de l'analyste : enrichir une alerte, ouvrir un dossier, prévenir quelqu'un, et parfois agir.</p>
<p>Ce matin, les outils d'Orbitale ont produit des milliers d'événements et des dizaines d'alertes. Pour chacune, l'analyste fait les mêmes gestes : chercher l'empreinte dans VirusTotal, regarder la machine, ouvrir un dossier dans l'outil de gestion des incidents, prévenir le bon responsable. Ces gestes prennent du temps, ils sont toujours identiques, et un humain fatigué finit par en oublier.</p>
<table class="t"><tr><th>Mot</th><th>Sens</th></tr>
<tr><td>Orchestration</td><td>Faire travailler ensemble des outils qui ne se connaissent pas, par leurs API</td></tr>
<tr><td>Automatisation</td><td>Exécuter sans humain une suite de gestes décidée à l'avance</td></tr>
<tr><td>Réponse</td><td>Agir sur l'incident : isoler, bloquer, désactiver un compte</td></tr>
<tr><td>Scénario, ou playbook</td><td>La suite écrite des gestes à faire pour un type d'alerte</td></tr></table>
<table class="t"><tr><th>Outil</th><th>Ce qu'il est</th></tr>
<tr><td>Shuffle</td><td>SOAR libre, scénarios dessinés à la souris, des centaines d'applications prêtes. C'est celui d'Orbitale</td></tr>
<tr><td>TheHive et Cortex</td><td>Gestion des alertes et des dossiers d'incident, et moteur d'analyse des indicateurs</td></tr>
<tr><td>Cortex XSOAR et Splunk SOAR</td><td>Les grands SOAR commerciaux</td></tr></table>
<div class="encadre retenir"><b>À retenir</b> On automatise d'abord ce qui ne casse rien : enrichir, documenter, prévenir. La réponse automatique vient en dernier, quand on connaît les faux positifs de chaque règle.</div>`},
{t:'Anatomie d\'un scénario Shuffle',h:`
<p class="intro">Dans Shuffle, un scénario s'appelle un workflow. Il commence par un déclencheur, enchaîne des actions, et chaque flèche entre deux actions peut porter une condition.</p>
<div class="schema" data-schema="soar"></div>
<p>Le déclencheur d'Orbitale est un webhook, une adresse web qui attend des messages. Le serveur Wazuh y envoie ses alertes grâce au bloc d'intégration de son fichier <code>ossec.conf</code> :</p>
<pre>&lt;integration&gt;
  &lt;name&gt;shuffle&lt;/name&gt;
  &lt;hook_url&gt;https://shuffle.orbitale.local/api/v1/hooks/webhook_8f2c41d7...&lt;/hook_url&gt;
  &lt;level&gt;10&lt;/level&gt;
  &lt;alert_format&gt;json&lt;/alert_format&gt;
&lt;/integration&gt;</pre>
<table class="t"><tr><th>Balise</th><th>Rôle</th></tr>
<tr><td><code>name</code></td><td>Le script d'intégration fourni par Wazuh, ici celui de Shuffle</td></tr>
<tr><td><code>hook_url</code></td><td>L'adresse du webhook, copiée depuis le déclencheur du workflow</td></tr>
<tr><td><code>level</code></td><td>Le niveau minimal des alertes envoyées. 10 veut dire 10 et plus</td></tr>
<tr><td><code>alert_format</code></td><td>Le format d'envoi, toujours json pour Shuffle</td></tr></table>
<p>Chaque alerte reçue démarre une exécution. Dans les actions, <code>$exec</code> désigne l'alerte reçue : <code>$exec.agent.name</code> donne la machine, <code>$exec.rule.level</code> le niveau, <code>$exec.rule.id</code> la règle. Le résultat d'une action précédente se lit par son nom, par exemple <code>$hash_report.data</code>.</p>
<p>Une condition compare deux valeurs avec un opérateur : <code>equals</code>, <code>does not equal</code>, <code>contains</code>, <code>starts with</code>, <code>larger than</code>, <code>less than</code>. Si la condition est fausse, l'action au bout de la flèche ne s'exécute pas, et l'exécution la marque SKIPPED.</p>
<div class="encadre piege"><b>Piège</b> Les opérateurs de comparaison sont stricts. <code>larger than 10</code> laisse passer 11, 12, 13, mais pas 10. Shuffle ne propose pas de « supérieur ou égal ». Pour dire « 10 et plus », on écrit <code>larger than 9</code>. Une condition mal bornée fait disparaître des alertes sans aucun message d'erreur.</div>`},
{t:'Répondre sans arrêter l\'usine',h:`
<p class="intro">Isoler automatiquement une machine sur une alerte grave est tentant. C'est aussi le moyen le plus rapide de provoquer soi-même la panne que l'on voulait éviter.</p>
<p>Une règle de niveau 12 n'est pas une preuve d'attaque, le chapitre 02 l'a montré. Un automate qui isole toute machine en alerte 12 isolera aussi les vrais positifs bénins : une sauvegarde, un script d'administration, un scanner. Chez Orbitale, deux machines ne doivent jamais être coupées sans un humain. DC-01 authentifie toute l'entreprise. SRV-CAO-01 délivre les licences sans lesquelles les centres d'usinage de l'atelier s'arrêtent.</p>
<table class="t"><tr><th>Garde-fou</th><th>Comment l'écrire dans Shuffle</th></tr>
<tr><td>Liste des machines critiques</td><td>Une condition <code>$exec.agent.name does not equal DC-01</code> sur la flèche vers l'isolement, une par machine protégée</td></tr>
<tr><td>Seuil élevé</td><td>Isoler seulement au-dessus d'un niveau précis, et enrichir en dessous</td></tr>
<tr><td>Validation humaine</td><td>L'action User Input de Shuffle attend qu'un analyste clique pour continuer</td></tr>
<tr><td>Traçabilité</td><td>Chaque isolement automatique ouvre aussi un dossier, avec son commentaire</td></tr></table>
<p>Une flèche peut porter plusieurs conditions. Elles doivent toutes être vraies pour que l'action s'exécute. Pour viser une seule famille d'alertes, on combine le niveau, la règle et la machine.</p>
<div class="encadre retenir"><b>À retenir</b> Avant d'automatiser une réponse, posez trois questions. Quels sont les faux positifs connus de cette règle. Quelle machine ne doit jamais être coupée sans un humain. Comment revenir en arrière, ici par <code>release</code> dans Elastic.</div>`}
]},
{id:'c9',num:'10',titre:'Le mini SOC',obj:['Relier les vues du SIEM, du HIDS, de l\'EDR, du pare-feu et de l\'IDS par des pivots','Séparer un usage légitime d\'un usage malveillant du même outil','Tenir la main courante et écrire le rapport','Savoir qui prévenir, et dans quels délais'],sections:[
{t:'Faire parler les outils ensemble',h:`<div class="schema" data-schema="minisoc"></div>
<p class="intro">Aucun outil ne voit toute l'attaque. Le travail de l'analyste est de relier les vues par des pivots communs.</p>
<p>Le SIEM voit les alertes et, dans ses archives, tous les événements. Le HIDS voit le fichier déposé, la clé de registre et l'archive créée. L'EDR voit l'arbre des processus et peut agir. Le pare-feu voit le volume qui sort. L'IDS reconnaît l'outil dans le trafic. Le SOAR garde la trace de ce qui a été envoyé, enrichi et fait automatiquement.</p>
<table class="t"><tr><th>Pivot</th><th>Où le chercher</th></tr>
<tr><td>Nom de machine et adresse IP</td><td>Partout</td></tr>
<tr><td>Heure</td><td>Partout, à la seconde près, d'où l'importance du NTP</td></tr>
<tr><td>Nom, chemin et empreinte d'un exécutable</td><td>SIEM, HIDS, EDR, SOAR</td></tr>
<tr><td>Adresse distante et nom de domaine</td><td>Archives du SIEM, pare-feu, IDS</td></tr>
<tr><td>Compte</td><td>SIEM, EDR</td></tr>
<tr><td>Volume en octets</td><td>Pare-feu, archives du SIEM pour les événements réseau</td></tr></table>
<p>Méthode : partez d'un fait sûr, une alerte. Prenez-en un attribut précis, une adresse par exemple. Cherchez cet attribut dans un autre outil. Chaque nouveau résultat apporte un nouvel attribut, que vous cherchez à son tour. Notez chaque saut dans la main courante.</p>
<div class="encadre piege"><b>Piège</b> Un outil ne montre que ce qu'il sait mesurer. Le pare-feu compte des octets mais ignore le nom du fichier. Le HIDS connaît le fichier mais pas la destination. Pour répondre à « qu'est-ce qui est parti, où et combien », il faut plusieurs outils.</div>`},
{t:'Le même outil, deux histoires',h:`
<p class="intro">Les attaquants aiment les outils légitimes. rclone sauvegarde vers le cloud, 7-Zip compresse, PsExec administre. Un antivirus ne les bloquera jamais, puisque ce sont de bons logiciels.</p>
<p>Ce matin, la même règle de niveau 12 s'est déclenchée deux fois sur rclone. Le niveau ne dit rien de l'intention. Ce qui sépare une sauvegarde d'une exfiltration se lit dans le contexte de l'exécution.</p>
<table class="t"><tr><th>Critère</th><th>Usage prévu</th><th>Usage détourné</th></tr>
<tr><td>Chemin</td><td>Un dossier d'installation connu, Program Files</td><td>Un dossier de passage, ProgramData, Temp, AppData</td></tr>
<tr><td>Parent</td><td>Le planificateur de tâches, un service connu</td><td>Un processus déjà suspect, ou un service au nom imité</td></tr>
<tr><td>Compte</td><td>Le compte de service prévu pour cette tâche</td><td>Un compte volé, ou un compte prévu pour autre chose</td></tr>
<tr><td>Destination</td><td>Le stockage contractuel de l'entreprise</td><td>Une adresse inconnue, souvent un stockage loué la veille</td></tr>
<tr><td>Historique</td><td>Le même événement tous les jours à la même heure</td><td>Une première fois</td></tr></table>
<p>Ce dernier critère s'appelle la ligne de base : ce qui est normal pour cette machine. Une recherche sur les jours précédents, dans les archives du SIEM, répond souvent mieux qu'une analyse longue.</p>
<div class="encadre retenir"><b>À retenir</b> Une détection juste sur un outil légitime ne cherche pas l'outil, elle cherche l'écart à l'usage prévu : un autre chemin, un autre parent, un autre compte, une autre destination.</div>`},
{t:'La main courante et le rapport',h:`
<p class="intro">La main courante est le journal de bord de l'incident. Chaque ligne donne une heure, une source, un constat et, le cas échéant, une action. Elle sert à reconstituer la chronologie et à rédiger le rapport.</p>
<table class="t"><tr><th>Heure de l'événement</th><th>Outil</th><th>Constat</th><th>Action</th></tr>
<tr><td>08:11:38</td><td>Wazuh, règle 5712</td><td>Force brute SSH sur WEB-DMZ-01 depuis une adresse externe</td><td>Vérifier la réponse active</td></tr>
<tr><td>Exemple</td><td>Exemple</td><td>Un fait, pas une supposition</td><td>Qui, quand</td></tr></table>
<p>Notez l'heure de l'événement, pas l'heure à laquelle vous l'avez lu. Écrivez des faits vérifiables, avec l'outil qui les montre. Une hypothèse se note comme telle, et se barre quand elle est infirmée, sans s'effacer.</p>
<table class="t"><tr><th>Partie du rapport</th><th>Contenu</th></tr>
<tr><td>Résumé</td><td>Cinq lignes lisibles par la direction : quoi, depuis quand, quel impact, est-ce contenu</td></tr>
<tr><td>Chronologie</td><td>Les étapes de l'attaque, heure par heure, avec leurs techniques ATT&amp;CK</td></tr>
<tr><td>Périmètre</td><td>Machines, comptes, données touchées, et ce qui ne l'est pas</td></tr>
<tr><td>Actions</td><td>Ce qui a été contenu, quand, par qui</td></tr>
<tr><td>Indicateurs</td><td>Domaines, adresses, empreintes, noms de fichiers, désarmés</td></tr>
<tr><td>Recommandations</td><td>Ce qui aurait empêché ou raccourci l'attaque, par ordre d'effet</td></tr></table>
<div class="encadre retenir"><b>À retenir</b> Un indicateur se désarme dans un rapport, <code>cdn-maj-doc[.]com</code> et <code>hxxps</code>, pour que personne ne clique par erreur.</div>`},
{t:'Prévenir les bonnes personnes',h:`
<p class="intro">Un incident ne reste pas au SOC. Selon ce qui a été touché, la loi et les contrats imposent de prévenir des autorités, dans des délais courts.</p>
<table class="t"><tr><th>Qui</th><th>Quand</th><th>Pourquoi</th></tr>
<tr><td>Le RSSI</td><td>Tout de suite</td><td>Il décide de l'escalade et de la cellule de crise</td></tr>
<tr><td>La CNIL</td><td>Dans les 72 heures après la découverte</td><td>Article 33 du RGPD, dès qu'une violation touche des données personnelles avec un risque pour les personnes</td></tr>
<tr><td>L'ANSSI, par le CERT-FR</td><td>Selon le statut de l'entreprise</td><td>La directive NIS 2 prévoit une alerte précoce sous 24 heures, une notification sous 72 heures et un rapport final sous un mois pour les entités concernées</td></tr>
<tr><td>Le donneur d'ordre et la DRSD</td><td>Selon les contrats</td><td>Une entreprise de la base industrielle de défense signale les atteintes aux informations protégées</td></tr>
<tr><td>Le dépôt de plainte</td><td>Dès que possible</td><td>Il ouvre l'enquête judiciaire et sert à l'assurance</td></tr></table>
<p>Chez Orbitale, le serveur de fichiers contient les dossiers du personnel et les plans du programme ARGOS. Une sortie de données depuis ce serveur concerne donc à la fois la CNIL et le donneur d'ordre.</p>
<div class="encadre piege"><b>Piège</b> Le délai court à partir de la découverte, pas de la fin de l'enquête. On notifie ce que l'on sait, puis on complète. La main courante, avec ses heures, prouve quand l'incident a été découvert.</div>`}
]},
{id:'c10',num:'11',titre:'Le TP réel',obj:['Monter en binôme un mini SOC avec les vrais outils libres','Faire remonter un poste Windows instrumenté dans Wazuh et dans Elastic','Écrire et tester une règle, puis brancher Shuffle','Rejouer une technique ATT&CK sans danger et la détecter'],sections:[
{t:'L\'architecture à monter',h:`
<p class="intro">En fin de module, chaque binôme monte son propre mini SOC sur des machines virtuelles, avec les outils que vous venez d'utiliser. Tout se passe sur un réseau isolé, sans accès à d'autres machines que les vôtres.</p>
<div class="schema" data-schema="tp"></div>
<table class="t"><tr><th>Machine</th><th>Système</th><th>Ressources conseillées</th><th>Rôle</th></tr>
<tr><td>soc-wazuh</td><td>Ubuntu 24.04</td><td>4 processeurs, 8 Go, 50 Go</td><td>Wazuh tout en un : serveur, indexeur, tableau de bord</td></tr>
<tr><td>soc-elastic</td><td>Ubuntu 24.04</td><td>4 processeurs, 8 Go, 50 Go</td><td>Elasticsearch, Kibana et Fleet Server</td></tr>
<tr><td>soc-shuffle</td><td>Ubuntu 24.04 avec Docker</td><td>2 processeurs, 4 Go</td><td>Shuffle</td></tr>
<tr><td>poste-01</td><td>Windows 11 d'évaluation</td><td>2 processeurs, 4 Go</td><td>Sysmon, agent Wazuh, Elastic Agent avec Elastic Defend</td></tr></table>
<p>Les ressources dépendent des versions. Vérifiez-les dans la documentation de la version que vous installez. Si la machine hôte manque de mémoire, Elastic et Shuffle peuvent partager une même machine virtuelle.</p>
<table class="t"><tr><th>Rôle dans le binôme</th><th>Ce qu'il fait</th></tr>
<tr><td>Ingénieur</td><td>Installe, configure, corrige</td></tr>
<tr><td>Analyste</td><td>Vérifie chaque remontée, tient la main courante du TP, rédige les preuves</td></tr></table>
<p>Échangez les rôles à mi-parcours. La note porte sur les preuves, pas sur la vitesse.</p>`},
{t:'Monter le SIEM et le HIDS',h:`
<p class="intro">Wazuh s'installe en une commande sur une machine Linux neuve. L'agent Windows s'installe ensuite en une ligne PowerShell, en administrateur.</p>
<pre>curl -sO https://packages.wazuh.com/4.12/wazuh-install.sh
sudo bash ./wazuh-install.sh -a</pre>
<p>L'option <code>-a</code> installe tout sur la même machine. À la fin, le script affiche l'utilisateur <code>admin</code> et son mot de passe. Le tableau de bord répond en HTTPS sur l'adresse de la machine.</p>
<pre>Invoke-WebRequest -Uri https://packages.wazuh.com/4.x/windows/wazuh-agent-4.12.0-1.msi -OutFile $env:tmp\\wazuh-agent
msiexec.exe /i $env:tmp\\wazuh-agent /q WAZUH_MANAGER='10.0.0.10' WAZUH_AGENT_NAME='poste-01'
NET START WazuhSvc</pre>
<p>Sysmon s'installe avec une configuration, par exemple celle d'Olaf Hartong ou celle de SwiftOnSecurity, qui choisit les événements utiles :</p>
<pre>Sysmon64.exe -accepteula -i sysmonconfig.xml</pre>
<p>Il reste à dire à l'agent de lire le canal Sysmon, dans <code>C:\\Program Files (x86)\\ossec-agent\\ossec.conf</code>, puis à redémarrer le service :</p>
<pre>&lt;localfile&gt;
  &lt;location&gt;Microsoft-Windows-Sysmon/Operational&lt;/location&gt;
  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;</pre>
<table class="t"><tr><th>Preuve attendue</th><th>Où la montrer</th></tr>
<tr><td>Agent actif</td><td>Endpoints, statut active</td></tr>
<tr><td>Événement Sysmon 1 visible</td><td>Threat Hunting, filtre <code>data.win.system.eventID:1</code></td></tr>
<tr><td>Un fichier surveillé modifié</td><td>File Integrity Monitoring, Events</td></tr>
<tr><td>Une règle locale qui se déclenche</td><td>Ruleset Test, puis une vraie alerte</td></tr></table>`},
{t:'Ajouter l\'EDR et le SOAR',h:`
<p class="intro">Elastic se monte en trois temps : la pile, le serveur Fleet, puis l'agent du poste avec l'intégration Elastic Defend.</p>
<ol class="grand"><li><b>La pile</b> Installez Elasticsearch puis Kibana depuis les paquets officiels, et activez l'essai de 30 jours pour avoir les actions de réponse</li>
<li><b>Fleet</b> Dans Kibana, Fleet, ajoutez un Fleet Server sur la même machine, avec la commande que Kibana affiche</li>
<li><b>La politique</b> Créez une politique d'agent, ajoutez l'intégration Elastic Defend, réglez les protections en Prevent</li>
<li><b>Le poste</b> Installez Elastic Agent avec le jeton d'inscription de cette politique</li></ol>
<pre>.\\elastic-agent.exe install --url=https://10.0.0.20:8220 --enrollment-token=VOTRE_JETON</pre>
<p>Shuffle se lance avec Docker. Il a besoin d'un dossier pour sa base, et d'un réglage du noyau pour son moteur de recherche :</p>
<pre>git clone https://github.com/Shuffle/Shuffle
cd Shuffle
mkdir shuffle-database
sudo chown -R 1000:1000 shuffle-database
sudo sysctl -w vm.max_map_count=262144
docker compose up -d</pre>
<p>L'interface répond sur le port 3001. Créez un workflow, ajoutez un déclencheur Webhook, copiez son adresse dans le bloc <code>integration</code> du serveur Wazuh, puis redémarrez le serveur avec <code>systemctl restart wazuh-manager</code>.</p>
<table class="t"><tr><th>Preuve attendue</th><th>Où la montrer</th></tr>
<tr><td>Poste vu par Elastic, en Prevent</td><td>Assets, Endpoints, colonne Policy</td></tr>
<tr><td>Poste isolé puis libéré</td><td>Response actions history</td></tr>
<tr><td>Une alerte Wazuh reçue par Shuffle</td><td>Workflow, Executions</td></tr>
<tr><td>Une branche conditionnelle qui filtre</td><td>Une exécution avec une action SKIPPED, expliquée</td></tr></table>`},
{t:'Rejouer une attaque et la détecter',h:`
<p class="intro">Pour vérifier une détection, il faut produire le comportement. Atomic Red Team, de Red Canary, fournit des tests courts, rangés par technique ATT&amp;CK.</p>
<pre>IEX (IWR 'https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/install-atomicredteam.ps1' -UseBasicParsing)
Install-AtomicRedTeam -getAtomics
Invoke-AtomicTest T1059.001 -ShowDetailsBrief
Invoke-AtomicTest T1547.001 -TestNumbers 1
Invoke-AtomicTest T1547.001 -TestNumbers 1 -Cleanup</pre>
<p><code>-ShowDetailsBrief</code> liste les tests sans rien exécuter. Lisez toujours un test avant de le lancer. <code>-Cleanup</code> défait ce que le test a fait. Les tests se lancent seulement sur votre poste du TP, jamais sur une machine qui n'est pas la vôtre.</p>
<table class="t"><tr><th>Technique rejouée</th><th>Ce que vous devez montrer</th></tr>
<tr><td>T1547.001, clé Run</td><td>L'alerte FIM de Wazuh sur la clé, et l'alerte Elastic Startup or Run Key Registry Modification</td></tr>
<tr><td>T1059.001, PowerShell</td><td>L'arbre du processus dans l'analyseur d'Elastic</td></tr>
<tr><td>T1003.001, mémoire de LSASS</td><td>Avec Prevent, l'alerte de prévention et le processus arrêté</td></tr></table>
<div class="encadre piege"><b>Piège</b> Elastic Defend en Prevent peut bloquer le test lui-même, et c'est une réussite. Notez-le comme preuve plutôt que de désactiver la protection pour voir passer l'attaque.</div>`},
{t:'La grille d\'évaluation',h:`
<table class="t"><tr><th>Critère</th><th>Points</th><th>Ce qui est regardé</th></tr>
<tr><td>Wazuh opérationnel, agent actif</td><td>3</td><td>Capture du tableau de bord avec l'agent</td></tr>
<tr><td>Sysmon remonté</td><td>2</td><td>Un événement 1 ouvert, champs lus</td></tr>
<tr><td>Règle locale écrite et testée</td><td>3</td><td>Le XML, la sortie de wazuh-logtest, l'alerte réelle</td></tr>
<tr><td>Elastic Defend en Prevent</td><td>3</td><td>Politique, poste, une alerte de prévention</td></tr>
<tr><td>Isolement puis libération</td><td>2</td><td>Historique des actions avec commentaires</td></tr>
<tr><td>Shuffle relié à Wazuh</td><td>3</td><td>Une exécution réelle et une condition expliquée</td></tr>
<tr><td>Deux techniques rejouées et détectées</td><td>2</td><td>Les deux outils qui les voient</td></tr>
<tr><td>Main courante du TP</td><td>2</td><td>Heures, preuves, problèmes rencontrés et solutions</td></tr></table>
<p>Total sur 20. Une étape qui échoue mais qui est bien documentée, avec le message d'erreur, la cause trouvée et ce que vous avez tenté, rapporte une partie des points. Une étape qui marche sans preuve n'en rapporte aucun.</p>
<div class="encadre retenir"><b>À retenir</b> Dans un vrai SOC, ce qui n'est pas écrit n'a pas eu lieu. Le TP vous entraîne à prouver autant qu'à installer.</div>`}
]}
);

function socSha(ascii){
 function r(n,x){return (x>>>n)|(x<<(32-n));}
 const K=[],H=[];let p=0;
 for(let c=2;p<64;c++){let pr=true;for(let d=2;d*d<=c;d++)if(c%d===0){pr=false;break;}if(pr){if(p<8)H[p]=(Math.pow(c,.5)*4294967296)|0;K[p++]=(Math.pow(c,1/3)*4294967296)|0;}}
 const b=unescape(encodeURIComponent(ascii));const w=[];const l=b.length*8;
 for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i)%4*8);
 w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;
 const h=H.slice();
 for(let j=0;j<w.length;j+=16){const o=h.slice(0,8);const W=[];
  for(let i=0;i<64;i++){
   if(i<16)W[i]=w[i+j]|0;else{const a=W[i-15],c=W[i-2];W[i]=(W[i-16]+(r(7,a)^r(18,a)^(a>>>3))+W[i-7]+(r(17,c)^r(19,c)^(c>>>10)))|0;}
   const e=h[4],t1=h[7]+(r(6,e)^r(11,e)^r(25,e))+((e&h[5])^(~e&h[6]))+K[i]+W[i];
   const a=h[0],t2=(r(2,a)^r(13,a)^r(22,a))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
   h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;h.pop();
  }
  for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0;
 }
 return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
