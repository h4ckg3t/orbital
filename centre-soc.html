<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBITAL Centre SOC</title><link rel="icon" href="orbital/favicon.ico"><style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f0d;color:#d9e3dc;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
code,pre,kbd,.mono{font-family:"Cascadia Mono",Consolas,"DejaVu Sans Mono",Menlo,monospace}
kbd{border:1px solid #4b5a51;border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:12px}
.cache{display:none!important}
#connexion{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% 20%,#12301f 0,#070a08 60%);z-index:50}
#connexion .boite{width:440px;max-width:92vw;border-left:3px solid #2bd96b;padding:28px 30px;background:#0d1410}
#connexion h1{font:600 13px "DejaVu Sans Mono",monospace;letter-spacing:.24em;color:#2bd96b;margin:0 0 6px}
#connexion h2{font-size:26px;margin:0 0 4px;color:#fff;font-weight:600}
#connexion p{color:#93a69a;margin:0 0 22px}
#connexion label{display:block;font-size:12px;color:#93a69a;margin-bottom:6px}
#connexion input{width:100%;padding:10px 12px;background:#050806;border:1px solid #2a3a30;color:#fff;border-radius:2px}
#connexion button{margin-top:16px;padding:10px 18px;background:#2bd96b;border:0;color:#04140a;font-weight:600;border-radius:2px}
#connexion .ligne{font:12px "DejaVu Sans Mono",monospace;color:#5d7466;margin-top:22px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:84px 1fr auto;grid-template-rows:34px 1fr}
#haut{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;background:#050806;border-bottom:1px solid #1d2a22;font-size:12px;color:#93a69a}
#haut .marque{font:600 12px "DejaVu Sans Mono",monospace;letter-spacing:.2em;color:#2bd96b}
#haut .eq{color:#d9e3dc}
#haut .esp{flex:1}
#haut button{background:none;border:1px solid #2a3a30;color:#b9c9be;padding:2px 10px;border-radius:2px;font-size:12px}
#rail{background:#070b09;border-right:1px solid #1d2a22;display:flex;flex-direction:column;padding-top:6px;overflow:auto}
#rail button{background:none;border:0;color:#7f9387;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;border-left:3px solid transparent}
#rail button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
#rail button:hover{color:#d9e3dc}
#rail button.on{color:#2bd96b;border-left-color:#2bd96b;background:#0d1611}
#rail .sep{height:1px;background:#1d2a22;margin:6px 10px}
#zone{position:relative;overflow:hidden;min-width:0}
.vue{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}
#panneau{width:368px;border-left:1px solid #1d2a22;background:#08100b;display:flex;flex-direction:column;transition:width .25s}
#panneau.ferme{width:34px}
#panneau .languette{display:none;writing-mode:vertical-rl;transform:rotate(180deg);background:none;border:0;color:#2bd96b;font:600 12px "DejaVu Sans Mono",monospace;letter-spacing:.25em;padding:14px 8px;height:100%}
#panneau.ferme .languette{display:block}
#panneau.ferme .pcontenu{display:none}
.pcontenu{display:flex;flex-direction:column;height:100%;min-height:0}
.ptete{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #1d2a22}
.ptete b{font:600 12px "DejaVu Sans Mono",monospace;letter-spacing:.2em;color:#2bd96b}
.ptete button{background:none;border:0;color:#93a69a;font-size:18px;line-height:1}
.pprog{padding:8px 14px;font-size:12px;color:#93a69a;border-bottom:1px solid #1d2a22}
.pbarre{height:3px;background:#1d2a22;margin-top:6px}.pbarre i{display:block;height:100%;background:#2bd96b}
.pliste{overflow:auto;flex:1;padding:6px 0 30px}
.mi{border-bottom:1px solid #132019;padding:10px 14px}
.mi .mt{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.mi .mn{font:600 11px "DejaVu Sans Mono",monospace;color:#5d7466;min-width:26px}
.mi.ok .mn{color:#2bd96b}
.mi .mtt{color:#d9e3dc;font-weight:600;font-size:13px}
.mi.verrou{opacity:.42}.mi.verrou .mt{cursor:default}
.mi .md{margin-top:8px;font-size:13px;color:#b9c9be}
.mi .msg{border-left:2px solid #2bd96b;padding:6px 10px;background:#0c1611;margin:8px 0;color:#cfe0d4}
.mi .msg .de{display:block;font-size:11px;color:#6f8a79;margin-bottom:3px}
.mi .chp{margin:8px 0}
.mi .chp label{display:block;font-size:12px;color:#93a69a;margin-bottom:3px}
.mi .chp input,.mi .chp select{width:100%;padding:6px 8px;background:#040705;border:1px solid #2a3a30;color:#fff;border-radius:2px}
.mi .act{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.mi .act button{padding:5px 12px;border-radius:2px;border:1px solid #2bd96b;background:#0f2b1a;color:#bff5d3;font-size:12px}
.mi .act button.sec{border-color:#2a3a30;background:none;color:#93a69a}
.mi .retour{font-size:12px;color:#ffb27a}.mi .retour.bon{color:#2bd96b}
.mi .ind{font-size:12px;color:#93a69a;margin-top:6px;border-top:1px dashed #22342a;padding-top:6px}
.mi .lien{color:#2bd96b;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-size:12px}
.mi .etat{font-size:12px;color:#93a69a}
.mi .etat .v{color:#2bd96b}
#lexique,#formateur{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center}
#lexique .boite,#formateur .boite{width:760px;max-width:94vw;max-height:84vh;overflow:auto;background:#0b120e;border:1px solid #2a3a30;padding:20px 24px}
#lexique h3,#formateur h3{margin:0 0 12px;color:#2bd96b;font:600 13px "DejaVu Sans Mono",monospace;letter-spacing:.2em}
#lexique dl{display:grid;grid-template-columns:140px 1fr;gap:6px 16px;margin:0}
#lexique dt{color:#fff;font-weight:600}#lexique dd{margin:0;color:#b9c9be}
#formateur input{padding:8px;background:#040705;border:1px solid #2a3a30;color:#fff;width:260px}
#formateur button{padding:6px 12px;margin:4px 6px 4px 0;background:#0f2b1a;border:1px solid #2bd96b;color:#bff5d3}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f2b1a;border:1px solid #2bd96b;color:#d9ffe7;padding:9px 16px;z-index:60;font-size:13px;border-radius:2px}

.orb{background:#0b0f0d}
.f-cadre{display:grid;grid-template-columns:250px 1fr;height:100%;min-height:0}
.f-som{border-right:1px solid #1d2a22;overflow:auto;padding:14px 0}
.f-som .ch{padding:6px 16px;color:#93a69a;cursor:pointer;display:flex;gap:10px}
.f-som .ch b{font:600 12px "DejaVu Sans Mono",monospace;color:#5d7466;min-width:20px}
.f-som .ch.on{color:#fff;background:#0f1914}.f-som .ch.on b{color:#2bd96b}
.f-som .ss{padding:3px 16px 3px 46px;font-size:12.5px;color:#6f8a79;cursor:pointer}
.f-som .ss.on{color:#2bd96b}.f-som .ss.lu::before{content:"";display:inline-block;width:5px;height:5px;background:#2bd96b;margin:0 6px 2px -11px;border-radius:50%}
.f-page{overflow:auto;padding:28px 48px 60px}
.f-page .fil{font:600 11px "DejaVu Sans Mono",monospace;letter-spacing:.2em;color:#2bd96b;margin-bottom:6px}
.f-page h2{font-size:28px;color:#fff;margin:0 0 18px;font-weight:600;max-width:900px}
.f-txt{max-width:900px;color:#cad8cf;font-size:15px}
.f-txt p{margin:0 0 14px}
.f-txt .intro{font-size:17px;color:#e8f2ec;border-left:3px solid #2bd96b;padding-left:14px}
.f-txt code{background:#121c16;padding:1px 5px;border-radius:2px;color:#9ff0bf;font-size:13px}
.f-txt pre{background:#050806;border:1px solid #1d2a22;padding:12px 14px;overflow:auto;color:#9ff0bf;font-size:13px;line-height:1.5}
.f-txt .t{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:14px}
.f-txt .t th{text-align:left;color:#2bd96b;font-weight:600;border-bottom:1px solid #2a3a30;padding:6px 10px 6px 0;font-size:12.5px}
.f-txt .t td{border-bottom:1px solid #16231b;padding:7px 10px 7px 0;vertical-align:top}
.f-txt .encadre{border:1px solid #2a3a30;padding:10px 14px;margin:14px 0;background:#0a120d}
.f-txt .encadre b{display:block;color:#2bd96b;margin-bottom:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.f-txt .encadre.piege{border-color:#5c3b1c}.f-txt .encadre.piege b{color:#ffb27a}
.f-txt .encadre.retenir{border-color:#1f5134}
.f-txt .note{font-size:13px;color:#7f9387}
.f-txt ol.grand li{margin-bottom:8px}.f-txt ol.grand b{color:#2bd96b;margin-right:6px}
.f-nav{display:flex;justify-content:space-between;max-width:900px;margin-top:30px;border-top:1px solid #1d2a22;padding-top:14px}
.f-nav button{background:none;border:1px solid #2a3a30;color:#b9c9be;padding:7px 14px;border-radius:2px}
.f-nav button.suiv{border-color:#2bd96b;color:#bff5d3}
.schema{border:1px solid #1d2a22;background:#060a08;margin:6px 0 18px;padding:14px;max-width:900px}
.schema svg{width:100%;height:auto;display:block}
.schema .sc-bas{display:flex;align-items:center;gap:12px;margin-top:10px}
.schema .sc-bas button{background:#0f2b1a;border:1px solid #2bd96b;color:#bff5d3;padding:4px 12px;font-size:12px;border-radius:2px}
.schema .sc-leg{flex:1;color:#cfe0d4;font-size:14px;min-height:40px}
.schema .sc-n{font:12px "DejaVu Sans Mono",monospace;color:#5d7466}
.sc-noeud rect{fill:#0d1611;stroke:#2a3a30;stroke-width:1.2;transition:all .35s}
.sc-noeud text{fill:#93a69a;font:13px system-ui,sans-serif;transition:fill .35s}
.sc-noeud text.p{font-size:11px;fill:#5d7466}
.sc-noeud.on rect{fill:#0f2b1a;stroke:#2bd96b}
.sc-noeud.on text{fill:#eafff2}
.sc-noeud.mal rect{fill:#2b1210;stroke:#ff6b5a}.sc-noeud.mal text{fill:#ffd9d4}
.sc-lien{stroke:#2a3a30;stroke-width:1.5;fill:none;transition:stroke .35s}
.sc-lien.on{stroke:#2bd96b}.sc-lien.mal{stroke:#ff6b5a}
.sc-pq{fill:#2bd96b;transition:transform .6s ease-in-out,opacity .3s}

.wz{background:#f5f7fa;color:#343741;font-family:Inter,system-ui,"Segoe UI",Roboto,sans-serif}
.wz-tete{height:48px;background:#fff;border-bottom:1px solid #d3dae6;display:flex;align-items:center;padding:0 14px;gap:14px;flex:none}
.wz-logo{font-weight:700;color:#1d1e24;letter-spacing:-.01em;font-size:17px}
.wz-logo i{font-style:normal;color:#3595f9}
.wz-fil{font-size:14px;color:#69707d}.wz-fil b{color:#343741;font-weight:600}
.wz-onglets{display:flex;gap:2px;background:#fff;border-bottom:1px solid #d3dae6;padding:0 14px;flex:none}
.wz-onglets button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:#69707d;font-size:14px}
.wz-onglets button.on{color:#006bb8;border-bottom-color:#006bb8;font-weight:600}
.wz-corps{flex:1;overflow:auto;padding:14px 16px 40px;min-height:0}
.wz-bar{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;flex-wrap:wrap}
.wz-bar select,.wz-bar input{border:1px solid #d3dae6;background:#fbfcfd;padding:7px 10px;border-radius:4px;font-size:14px;color:#343741}
.wz-bar input.q{flex:1;min-width:280px;font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:13px}
.wz-bar button{border:0;background:#0077cc;color:#fff;padding:7px 14px;border-radius:4px;font-weight:600}
.wz-bar button.sec{background:#e9edf3;color:#343741;font-weight:500}
.wz-err{color:#bd271e;font-size:13px;margin:-4px 0 8px}
.wz-carte{background:#fff;border:1px solid #d3dae6;border-radius:6px;padding:12px 14px;margin-bottom:12px}
.wz-carte h4{margin:0 0 8px;font-size:14px;color:#1a1c21}
.wz-histo{display:flex;align-items:flex-end;gap:2px;height:80px;padding-top:6px}
.wz-histo div{flex:1;background:#54b399;min-height:1px;position:relative}
.wz-histo div:hover{background:#3d8a75}
.wz-hx{display:flex;justify-content:space-between;font-size:11px;color:#69707d;margin-top:4px}
.wz-nb{font-size:13px;color:#69707d;margin:6px 0}
.wz-tab{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.wz-tab th{text-align:left;padding:7px 8px;border-bottom:1px solid #d3dae6;color:#1a1c21;font-weight:600;background:#fff;position:sticky;top:0}
.wz-tab td{padding:6px 8px;border-bottom:1px solid #eef2f7;vertical-align:top}
.wz-tab tr.lg:hover td{background:#f1f6fc;cursor:pointer}
.wz-tab tr.ouv td{background:#eaf3fd}
.wz-tab td.mono{font-size:12px}
.niv{display:inline-block;min-width:24px;text-align:center;border-radius:3px;padding:0 5px;font-weight:600;font-size:12px;color:#fff;background:#98a2b3}
.niv.n5{background:#d6bf57;color:#1a1c21}.niv.n8{background:#e7664c}.niv.n12{background:#bd271e}
.wz-det{background:#fbfcfd;border:1px solid #d3dae6;margin:4px 0 8px;padding:8px 10px}
.wz-det .ong button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;color:#69707d}
.wz-det .ong button.on{color:#006bb8;border-bottom-color:#006bb8}
.wz-det table{width:100%;border-collapse:collapse;font-size:12.5px}
.wz-det td{padding:3px 6px;border-bottom:1px solid #eef2f7;vertical-align:top;word-break:break-all}
.wz-det td.k{width:290px;color:#343741;font-family:"DejaVu Sans Mono",monospace;font-size:12px;word-break:normal}
.wz-det td.v{font-family:"DejaVu Sans Mono",monospace;font-size:12px}
.wz-det .plus{border:1px solid #d3dae6;background:#fff;border-radius:3px;font-size:11px;padding:0 5px;margin-right:6px;color:#006bb8}
.wz-det pre{margin:6px 0 0;font-size:12px;max-height:420px;overflow:auto;background:#fff;border:1px solid #eef2f7;padding:8px}
.wz-stat{display:flex;gap:12px;flex-wrap:wrap}
.wz-stat .s{background:#fff;border:1px solid #d3dae6;border-radius:6px;padding:10px 16px;min-width:150px}
.wz-stat .s b{display:block;font-size:24px;color:#1a1c21;font-weight:600}
.wz-stat .s span{font-size:12px;color:#69707d}
.pt{display:inline-flex;align-items:center;gap:6px}.pt::before{content:"";width:8px;height:8px;border-radius:50%;background:#7de2d1}
.pt.off::before{background:#98a2b3}.pt.ko::before{background:#bd271e}
.wz-reg{display:grid;grid-template-columns:260px 1fr;gap:12px;min-height:0}
.wz-reg .fl{background:#fff;border:1px solid #d3dae6;border-radius:6px;overflow:auto;max-height:calc(100vh - 170px)}
.wz-reg .fl div{padding:7px 10px;border-bottom:1px solid #eef2f7;cursor:pointer;font-family:"DejaVu Sans Mono",monospace;font-size:12.5px}
.wz-reg .fl div.on{background:#eaf3fd;color:#006bb8}
.wz-reg .fl div small{display:block;color:#69707d;font-family:system-ui;font-size:11px}
.wz-ed{width:100%;height:360px;font:13px/1.5 "DejaVu Sans Mono",Consolas,monospace;border:1px solid #d3dae6;padding:10px;background:#fff;color:#1a1c21;resize:vertical;tab-size:2}
.wz-ed[readonly]{background:#fbfcfd}
.wz-res{font-size:13px;margin-top:8px}
.wz-res pre{background:#1a1c21;color:#d4dae5;padding:10px;font-size:12px;overflow:auto;max-height:300px}
.wz-ok{color:#007871}.wz-ko{color:#bd271e}
.wz-badge{display:inline-block;border:1px solid #d3dae6;border-radius:3px;padding:0 6px;font-size:11px;margin-right:4px;background:#fbfcfd}
.sca-p{color:#007871;font-weight:600}.sca-f{color:#bd271e;font-weight:600}

.edr{background:#0f141b;color:#c7d0dc;font-family:system-ui,"Segoe UI",sans-serif}
.edr-tete{height:46px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#141b24;border-bottom:1px solid #253041;flex:none}
.edr-tete .nm{font-weight:700;color:#fff;letter-spacing:.06em}
.edr-tete .nm i{font-style:normal;color:#ff8a3d}
.edr-ong{display:flex;gap:4px}
.edr-ong button{background:none;border:0;color:#8c9bb0;padding:7px 12px;border-radius:4px}
.edr-ong button.on{background:#223042;color:#fff}
.edr-corps{flex:1;overflow:auto;padding:14px 16px 40px;min-height:0}
.edr-tab{width:100%;border-collapse:collapse;font-size:13px}
.edr-tab th{text-align:left;color:#8c9bb0;font-weight:500;padding:7px 8px;border-bottom:1px solid #253041;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.edr-tab td{padding:8px;border-bottom:1px solid #1b2430}
.edr-tab tr.lg:hover td{background:#16202c;cursor:pointer}
.sev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.sev.c{background:#4a1416;color:#ff8f8f}.sev.h{background:#4a2c12;color:#ffbe7a}.sev.m{background:#3d3a12;color:#efe28a}.sev.f{background:#183042;color:#8fc8ff}
.edr-btn{background:#223042;border:1px solid #33465f;color:#e2e8f0;padding:6px 12px;border-radius:4px;font-size:13px}
.edr-btn.dang{background:#5a1a1d;border-color:#8a2a2f}
.edr-btn:disabled{opacity:.4;cursor:default}
.edr-inv{display:grid;grid-template-columns:1fr 380px;gap:14px;min-height:0}
.edr-arbre{background:#121923;border:1px solid #253041;border-radius:6px;padding:12px;overflow:auto;max-height:calc(100vh - 210px)}
.edr-nd{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap}
.edr-nd:hover{background:#1a2532}.edr-nd.sel{background:#223042;outline:1px solid #3d5a80}
.edr-nd .pid{color:#6b7c93;font-size:11px}
.edr-nd .ic{width:14px;height:14px;border-radius:3px;background:#3d5a80;flex:none}
.edr-nd.mal .ic{background:#d9434b}.edr-nd.sus .ic{background:#e08a2c}
.edr-nd .nm{color:#e2e8f0}
.edr-nd .tg{font-size:10px;color:#ffbe7a;border:1px solid #6a4a1e;border-radius:8px;padding:0 6px}
.edr-ss{margin-left:18px;border-left:1px dashed #33465f;padding-left:8px}
.edr-pan{background:#121923;border:1px solid #253041;border-radius:6px;padding:12px;overflow:auto;max-height:calc(100vh - 210px);font-size:13px}
.edr-pan h4{margin:0 0 8px;color:#fff}
.edr-pan dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:0 0 10px}
.edr-pan dt{color:#8c9bb0}.edr-pan dd{margin:0;word-break:break-all;font-family:"DejaVu Sans Mono",monospace;font-size:12px;color:#e2e8f0}
.edr-pan .ev{border-top:1px solid #253041;padding:6px 0;font-size:12px}
.edr-pan .ev b{color:#ffbe7a;font-weight:600}
.edr-carte{background:#121923;border:1px solid #253041;border-radius:6px;padding:12px 14px;margin-bottom:12px}
.edr-carte h4{margin:0 0 8px;color:#fff;font-size:14px}
.edr-iso{color:#ff8f8f;font-weight:600}

.opn{background:#f4f4f4;color:#333;font-family:"Source Sans Pro",system-ui,sans-serif}
.opn-tete{height:46px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 16px;gap:14px;flex:none}
.opn-tete .nm{font-weight:700;color:#333;font-size:17px}.opn-tete .nm i{font-style:normal;color:#d94f00}
.opn-tete .h{color:#777;font-size:13px}
.opn-cadre{display:grid;grid-template-columns:220px 1fr;flex:1;min-height:0}
.opn-menu{background:#3a3a3a;color:#ddd;overflow:auto;font-size:13.5px}
.opn-menu .g{padding:10px 14px 4px;color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.opn-menu div.i{padding:7px 14px 7px 26px;cursor:pointer}

function socAplatir(e){
 const f={};
 if(e.win){for(const k in e.win.system)f['win.system.'+k]=e.win.system[k];for(const k in e.win.eventdata)f['win.eventdata.'+k]=e.win.eventdata[k];}
 if(e.srcip)f.srcip=e.srcip;if(e.srcuser)f.srcuser=e.srcuser;
 if(e.sc){for(const k in e.sc)f['syscheck.'+k]=String(e.sc[k]);}
 if(e.ids){f.event_type='alert';for(const k in e.ids)f['alert.'+k]=String(e.ids[k]);f.src_ip=e.ids.src_ip;f.dest_ip=e.ids.dest_ip;}
 return f;
}
function socLogBrut(e){
 if(e.full)return e.full;
 if(e.win)return JSON.stringify({win:e.win});
 if(e.sc)return 'File \''+e.sc.path+'\' '+e.sc.event;
 if(e.ids)return JSON.stringify({timestamp:e.t,event_type:'alert',src_ip:e.ids.src_ip,src_port:e.ids.src_port,dest_ip:e.ids.dest_ip,dest_port:e.ids.dest_port,proto:e.ids.proto,alert:{signature:e.ids.signature,category:e.ids.category,severity:e.ids.severity}});
 return '';
}
function socRe(txt,pcre){
 let s=txt,fl='';
 if(s.startsWith('(?i)')){s=s.slice(4);fl='i';}
 if(!pcre){s=s.replace(/\\\\/g,'\\\\');}
 return new RegExp(s,fl);
}
function socMatchRe(txt){
 const parts=txt.split('|').map(x=>x.replace(/[.*+?^${}()[\]\\]/g,'\\$&'));
 return new RegExp(parts.join('|'),'i');
}
function socParseFichier(xml,nom){
 const rules=[],errs=[];
 const doc=new DOMParser().parseFromString('<racine>'+xml.replace(/<\?xml[^>]*\?>/,'')+'</racine>','application/xml');
 const pe=doc.getElementsByTagName('parsererror')[0];
 if(pe){errs.push('XML invalide dans '+nom+' : '+pe.textContent.replace(/\s+/g,' ').slice(0,180));return {rules,errs};}
 for(const g of doc.getElementsByTagName('group')){
  if(g.parentNode.nodeName!=='racine')continue;
  const gg=(g.getAttribute('name')||'').split(',').filter(Boolean);
  for(const r of g.children){
   if(r.nodeName!=='rule'){continue;}
   const o={id:r.getAttribute('id'),level:parseInt(r.getAttribute('level'),10),fichier:nom,fields:[],groups:gg.slice(),mitre:[],xml:new XMLSerializer().serializeToString(r)};
   if(!o.id||!/^\d+$/.test(o.id)){errs.push('Une règle sans identifiant numérique dans '+nom);continue;}
   if(isNaN(o.level)||o.level<0||o.level>15){errs.push('Règle '+o.id+' : le niveau doit être compris entre 0 et 15');continue;}
   if(r.getAttribute('frequency')){o.freq=parseInt(r.getAttribute('frequency'),10);o.tf=parseInt(r.getAttribute('timeframe')||'60',10);}
   try{
    for(const c of r.children){
     const v=c.textContent.trim();
     if(c.nodeName==='if_sid')o.if_sid=v.split(/[ ,]+/).filter(Boolean);
     else if(c.nodeName==='if_group')o.if_group=v.split(/[ ,]+/).filter(Boolean);
     else if(c.nodeName==='if_matched_sid')o.if_matched_sid=v;
     else if(c.nodeName==='same_source_ip')o.same_ip=1;
     else if(c.nodeName==='decoded_as')o.decoded_as=v;
     else if(c.nodeName==='match')o.match=socMatchRe(v);
     else if(c.nodeName==='regex')o.regex=socRe(v,c.getAttribute('type')==='pcre2'||true);
     else if(c.nodeName==='field'){const nm=c.getAttribute('name');if(!nm)throw new Error('balise field sans attribut name');o.fields.push({name:nm,re:socRe(v,true),neg:c.getAttribute('negate')==='yes'});}
     else if(c.nodeName==='description')o.desc=v;
     else if(c.nodeName==='mitre'){for(const i of c.getElementsByTagName('id'))o.mitre.push(i.textContent.trim());}
     else if(c.nodeName==='group')o.groups.push(...v.split(',').filter(Boolean));
     else if(c.nodeName==='options'||c.nodeName==='info')continue;
     else throw new Error('balise inconnue <'+c.nodeName+'>');
    }
   }catch(err){errs.push('Règle '+o.id+' : '+err.message);continue;}
   if(!o.desc){errs.push('Règle '+o.id+' : la balise description est obligatoire');continue;}
   rules.push(o);
  }
 }
 return {rules,errs};
}
const SOC_MOTEUR={rules:[],byId:{},kids:{},roots:[],grpKids:{},errs:[]};
function socCompile(localXml){
 const M={rules:[],byId:{},kids:{},roots:[],grpKids:{},freq:[],errs:[]};
 const tout=[];
 for(const f of SOC_FICHIERS_REGLES){const r=socParseFichier(f.xml,f.nom);tout.push(...r.rules);}
 const loc=socParseFichier(localXml,'local_rules.xml');
 M.errs=loc.errs;
 loc.rules.forEach(r=>{r.local=1;if(+r.id<100000||+r.id>120000)M.errs.push('Règle '+r.id+' : une règle locale doit être numérotée de 100000 à 120000');});
 const locOk=loc.rules.filter(r=>+r.id>=100000&&+r.id<=120000);
 for(const r of locOk){if(tout.find(x=>x.id===r.id)||locOk.filter(x=>x.id===r.id).length>1){M.errs.push('Règle '+r.id+' : identifiant déjà utilisé');}}
 const all=[...locOk.filter(r=>!tout.find(x=>x.id===r.id)),...tout];
 for(const r of all){
  M.byId[r.id]=r;M.rules.push(r);
  if(r.if_matched_sid){M.freq.push(r);continue;}
  if(r.if_sid)r.if_sid.forEach(s=>{(M.kids[s]=M.kids[s]||[]).push(r);});
  else if(r.if_group)r.if_group.forEach(g=>{(M.grpKids[g]=M.grpKids[g]||[]).push(r);});
  else M.roots.push(r);
 }
 for(const r of locOk){if(r.if_sid)r.if_sid.forEach(s=>{if(!M.byId[s])M.errs.push('Règle '+r.id+' : la règle parente '+s+' n\'existe pas');});}
 for(const k in M.kids)M.kids[k].sort((a,b)=>(b.local||0)-(a.local||0));
 return M;
}
function socTeste(r,e,f,brut){
 if(r.decoded_as&&r.decoded_as!==e.dec)return false;
 for(const c of r.fields){const v=f[c.name];const ok=v!==undefined&&c.re.test(v);if(c.neg?ok:!ok)return false;}
 if(r.match&&!r.match.test(brut))return false;
 if(r.regex&&!r.regex.test(brut))return false;
 return true;
}
function socEvalue(M,e){
 const f=socAplatir(e),brut=socLogBrut(e);
 let cur=null,chaine=[];
 for(const r of M.roots){if(socTeste(r,e,f,brut)){cur=r;break;}}
 if(!cur)return {rule:null,chaine,f,brut};
 chaine.push(cur);
 for(let i=0;i<20;i++){
  let nx=null;
  const cands=[...(M.kids[cur.id]||[])];
  for(const g of cur.groups)if(M.grpKids[g])cands.push(...M.grpKids[g]);
  for(const r of cands){if(socTeste(r,e,f,brut)){nx=r;break;}}
  if(!nx)break;cur=nx;chaine.push(cur);
 }
 return {rule:cur,chaine,f,brut};
}
function socSec(t){const p=t.split(':');return (+p[0])*3600+(+p[1])*60+(+p[2]);}
function socDesc(r,f){return r.desc.replace(/\$\(([^)]+)\)/g,(m,k)=>f[k]!==undefined?f[k]:'');}
function socAnalyse(M){
 const res=[],hist={},dejaTire={};
 for(const e of SOC_EVT){
  const r=socEvalue(M,e);
  let rule=r.rule;
  if(rule){
   for(const fr of M.freq){
    if(fr.if_matched_sid!==rule.id&&!r.chaine.find(x=>x.id===fr.if_matched_sid))continue;
    const cle=fr.id+'|'+(fr.same_ip?(r.f.srcip||e.ip):'');
    const h=(hist[cle]=hist[cle]||[]);const s=socSec(e.t);
    h.push(s);while(h.length&&s-h[0]>fr.tf)h.shift();
    if(h.length>=fr.freq&&!(dejaTire[cle]&&s-dejaTire[cle]<=fr.tf)){rule=fr;dejaTire[cle]=s;h.length=0;break;}
   }
  }
  res.push({e,rule,chaine:r.chaine,f:r.f,brut:r.brut});
 }
 return res;
}
function socDocAlerte(x,i){

 if(Object.keys(data).length)d.data=data;
 if(e.sc){d.syscheck={};for(const k in e.sc){if(k==='reg'||k==='mode')continue;d.syscheck[k]=e.sc[k];}d.syscheck.mode='realtime';if(e.sc.reg)d.syscheck.arch='[x64]';}
