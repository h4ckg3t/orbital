function normX(s){return normal(s).replace(/\s*(>=|<=|:|>|<|=)\s*/g,'$1');}
async function fExoExpl(x,v){const k=normX(v);const i=x.h.indexOf(socSha('socx|'+x.id+'|'+k));if(i<0)return null;
 try{const b=s=>Uint8Array.from(atob(s),y=>y.charCodeAt(0));const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sockey|'+x.id+'|'+k));const key=await crypto.subtle.importKey('raw',d,'AES-GCM',false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(x.x[i][0])},key,b(x.x[i][1]));return new TextDecoder().decode(p);}catch(e){return '';}}
function fExoBranche(el,c){
 fExos(c).forEach(x=>{const B=$('.xb[data-x="'+x.id+'"]',el);if(!B)return;const R=$('.xr',B);
  const juge=async v=>{if(!String(v||'').trim())return;const e=await fExoExpl(x,v);
   if(e===null){B.classList.remove('ok');B.classList.add('ko');R.innerHTML='<b>Pas encore.</b> '+esc(x.ind||'Relisez la section du chapitre.');setTimeout(()=>B.classList.remove('ko'),600);return;}

   const som=$('.f-som .ss.ex',el);if(som){const X=fExos(c);som.textContent='Exercices, '+X.filter(y=>S.exo[y.id]).length+' sur '+X.length;}};
  $$('.xc',B).forEach(b=>b.onclick=()=>{$$('.xc',B).forEach(z=>z.classList.toggle('on',z===b));juge(b.dataset.v);});

 });
}

function ipNum(ip){const p=String(ip).split('.').map(Number);if(p.length!==4||p.some(x=>isNaN(x)||x<0||x>255))return null;return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];}
function ipDans(ip,motif){
 motif=String(motif||'').trim().toLowerCase();if(!motif||motif==='any'||motif==='tout')return true;
 return motif.split(/[\s,]+/).some(m=>{
  if(m.includes('/')){const [b,l]=m.split('/');const n=ipNum(b),x=ipNum(ip),L=+l;if(n==null||x==null||isNaN(L))return false;const mask=L===0?0:(0xffffffff<<(32-L))>>>0;return ((n&mask)>>>0)===((x&mask)>>>0);}
  return m===String(ip);
 });
}
function portDans(p,motif){motif=String(motif||'').trim().toLowerCase();if(!motif||motif==='any')return true;return motif.split(/[\s,]+/).some(m=>{if(m.includes(':')){const [a,b]=m.split(':').map(Number);return +p>=a&&+p<=b;}return String(+m)===String(+p);});}
function socFwTeste(itf,src,dst,dp,proto){return fwEval(S.fw[itf]||[],src,dst,dp,proto);}
function fwEval(L,src,dst,dp,proto){
 for(let i=0;i<L.length;i++){const r=L[i];
  if(r.off)continue;
  if(r.proto!=='any'&&proto&&r.proto!==proto)continue;
  if(!ipDans(src,r.src)||!ipDans(dst,r.dst)||!portDans(dp,r.dp))continue;
  return {act:r.act,r,i:i+1};
 }
 return {act:'block',r:{desc:'Blocage par défaut'},i:0};
}

function sfVal(expr,ctx){return String(expr==null?'':expr).replace(/\$([a-z_][\w]*)((?:\.[\w@-]+)*)/gi,(m,base,ch)=>{const o=base==='exec'?ctx.exec:ctx.res[base];if(o===undefined)return m;const v=ch?ch.slice(1).split('.').reduce((a,k)=>a==null?undefined:a[k],o):o;if(v===undefined)return '';return typeof v==='object'?JSON.stringify(v):String(v);});}
function sfCond(c,ctx){const a=sfVal(c.a,ctx),b=sfVal(c.b,ctx);const A=a.toLowerCase(),B=b.toLowerCase();
 switch(c.op){case 'equals':return A===B;case 'does not equal':return A!==B;case 'starts with':return A.startsWith(B);case 'ends with':return A.endsWith(B);case 'contains':return A.includes(B);case 'does not contain':return !A.includes(B);case 'larger than':return parseFloat(a)>parseFloat(b);case 'less than':return parseFloat(a)<parseFloat(b);case 'is empty':return !a||a==='[]'||a==='{}';case 'matches regex':try{return new RegExp(b,'i').test(a);}catch(e){return false;}}return false;}
function sfAction(n,ctx,appliquer){

 if(n.act==='Webhook')return {ok:1,out:ctx.exec};

 if(n.act==='Set cache value')return {ok:1,out:{success:true,key:p.key,value:p.value}};

 if(n.act==='Get a hash report'){sfVtInit();const h=(p.id||'').replace(/^SHA256=/i,'').trim().toLowerCase();if(!/^[a-f0-9]{32,64}$/.test(h))return {ok:0,out:{status:400,body:{error:{code:'InvalidArgumentError',message:'Invalid resource id'}}}};const r=SF_VT[h]||Object.values(SF_VT).find(x=>x.md5===h);if(!r)return {ok:1,out:{status:404,body:{error:{code:'NotFoundError',message:'File "'+h+'" not found'}}}};return {ok:1,out:{status:200,body:{data:{id:r.sha256,type:'file',attributes:{meaningful_name:r.nom,last_analysis_stats:{malicious:r.mal,suspicious:0,undetected:r.und,harmless:0},popular_threat_classification:r.lab?{suggested_threat_label:r.lab}:undefined,first_submission_date:r.first}}}}};}

 if(n.act==='Create alert'||n.act==='Create case'){const id='~'+(40960+(ctx.exec&&ctx.exec.rule?(+ctx.exec.rule.id%997):1));return {ok:1,out:{_id:id,_type:n.act==='Create case'?'Case':'Alert',title:p.title,severity:+p.severity||2,status:'New',source:p.source,sourceRef:p.sourceRef}};}
 if(n.act==='Isolate host'||n.act==='Release host'){const h=SOC_HOTES.find(x=>x.nom.toLowerCase()===String(p.hostname).toLowerCase());if(!h||!edrCouvert(h.nom))return {ok:0,out:{status:404,body:{message:'No endpoint found for host '+p.hostname}}};if(appliquer){if(n.act==='Isolate host'){if(!S.edr.iso[h.nom]){S.edr.iso[h.nom]=new Date().toLocaleTimeString('fr-FR');journalAction('SOAR','Isolement automatique de '+h.nom+' par Shuffle');}}else if(S.edr.iso[h.nom]){delete S.edr.iso[h.nom];journalAction('SOAR','Fin d\'isolement de '+h.nom+' par Shuffle');}}return {ok:1,out:{status:200,body:{action:n.act==='Isolate host'?'isolate':'unisolate',agents:[h.nom],comment:p.comment||''}}};}
 if(n.act==='Add blocklist entry'){if(!/^[a-f0-9]{64}$/i.test(p.sha256||''))return {ok:0,out:{status:400,body:{message:'Invalid sha256'}}};if(appliquer&&!S.edr.bloc.includes(p.sha256.toLowerCase())){S.edr.bloc.push(p.sha256.toLowerCase());S.edr.blocN=S.edr.blocN||{};S.edr.blocN[p.sha256.toLowerCase()]=p.name||'Shuffle';}return {ok:1,out:{status:200,body:{created:true}}};}

function sfEntrees(){return DOCS.filter(d=>d.rule&&d.rule.level>=10);}
function sfExecute(wf,doc,appliquer){
 const ctx={exec:doc,res:{}},trace=[];const vu={};
 const start=wf.nodes.find(n=>n.app==='webhook');if(!start)return {trace,statut:'ABORTED'};
 const file=[start.id];
 while(file.length){const id=file.shift();if(vu[id])continue;vu[id]=1;const n=wf.nodes.find(x=>x.id===id);if(!n)continue;
  const r=sfAction(n,ctx,appliquer);ctx.res[n.label]=r.out;trace.push({n,ok:r.ok,out:r.out});
  if(!r.ok)continue;
  wf.edges.filter(e=>e.s===id).forEach(e=>{const f=sfCn(e).find(c=>!sfCond(c,ctx));if(!f)file.push(e.d);else trace.push({n:wf.nodes.find(x=>x.id===e.d),skip:1,e,c:f});});
 }
 return {trace,statut:trace.some(t=>t.ok===0)?'FINISHED WITH ERRORS':'FINISHED',doc};
}

const CH_OPS={
 'Depuis Base64':s=>{try{return atob(s.replace(/\s+/g,''));}catch(e){throw new Error('Ce texte n\'est pas du Base64 valide');}},
 'Décoder UTF-16LE':s=>{let o='';for(let i=0;i+1<s.length;i+=2)o+=String.fromCharCode(s.charCodeAt(i)|(s.charCodeAt(i+1)<<8));return o;},
 'Vers Base64':s=>btoa(unescape(encodeURIComponent(s))),
 'Désarmer une adresse':s=>s.replace(/https?:\/\//gi,m=>m.replace(/^http/i,'hxxp')).replace(/(\w)\.(\w)/g,'$1[.]$2'),
 'Réarmer une adresse':s=>s.replace(/hxxp/gi,'http').replace(/\[\.\]/g,'.'),
 'SHA-256':s=>socSha(s),
 'Décoder une URL':s=>{try{return decodeURIComponent(s);}catch(e){throw new Error('Codage URL invalide');}},
 'Vers hexadécimal':s=>[...s].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(' '),
 'Extraire les adresses IP':s=>(s.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g)||[]).join('\n'),
 'Extraire les domaines':s=>(s.match(/\b(?:[a-z0-9-]+\.)+(?:com|net|org|fr|local|io|xyz)\b/gi)||[]).join('\n'),

};

{id:'m7',titre:'Patient zéro',niv:2,ch:['c6',2],de:WR,msg:'Deux alertes de niveau 12 à six minutes d\'écart : Word a lancé PowerShell sur deux postes des achats. Je veux savoir où l\'attaquant a vraiment mis le pied.',q:'Sur quelle machine l\'attaque a-t-elle réussi, sous quel compte, et quel programme a lancé PowerShell ?',champs:[{k:'a',l:'Machine'},{k:'b',l:'Compte utilisateur, sans le domaine'},{k:'c',l:'Programme parent, avec son extension'}],ind:'Dans Elastic Security, ouvrez chaque alerte et lisez son titre en entier : Detection ou Prevention. L\'analyseur montre ce qui a suivi PowerShell.'},
{id:'m8',titre:'Le voisin protégé',niv:2,ch:['c6',1],de:WR,msg:'Sur PC-ACHATS-04, Camille a ouvert la même pièce jointe. Rien n\'a suivi. Je veux comprendre pourquoi un poste a tenu et pas l\'autre.',q:'Qu\'est-ce qui a arrêté l\'attaque sur PC-ACHATS-04, et quelle politique Elastic Defend appliquait chacun des deux postes ?',champs:[{k:'a',l:'Ce qui a arrêté l\'attaque',t:'sel',o:['Elastic Defend a terminé PowerShell','Le pare-feu a bloqué le domaine','La macro ne s\'est pas exécutée','Wazuh a isolé le poste']},{k:'b',l:'Politique de PC-ACHATS-04'},{k:'c',l:'Politique de PC-ACHATS-03'}],ind:'Elastic Security, Assets puis Endpoints. Le poste réinstallé le 10 novembre a gardé la politique d\'enrôlement.'},
{id:'m9',titre:'La commande cachée',niv:2,ch:['c3',2],de:WR,msg:'La ligne de commande de PowerShell est illisible. C\'est fait exprès. Décodez-la, je veux savoir où ce poste est allé chercher la suite.',q:'Quel domaine la commande contacte-t-elle, et quel fichier y récupère-t-elle ?',champs:[{k:'a',l:'Domaine'},{k:'b',l:'Nom du fichier téléchargé'}],ind:'Le paramètre -enc de PowerShell attend du Base64 d\'un texte en UTF-16LE. La boîte à outils enchaîne Depuis Base64 puis Décoder UTF-16LE.'},
{id:'m10',titre:'La pièce jointe',niv:2,ch:['c8',0],de:WR,msg:'Word n\'a pas ouvert ça tout seul. Quelque chose est arrivé par la messagerie à 8 h 47.',q:'Quel est le nom exact du document piégé, et quelle technique ATT&CK décrit cet accès initial ?',champs:[{k:'a',l:'Nom du fichier'},{k:'b',l:'Identifiant de la technique'}],ind:'Sysmon note la création de fichiers (événement 11). Le nom figure aussi dans la ligne de commande de WINWORD.EXE.'},
{id:'m11',titre:'Ce que le pare-feu a laissé sortir',niv:2,ch:['c7',1],de:WR,msg:'Le domaine pointe vers une adresse. Le pare-feu a forcément vu passer ces connexions. Comptez-les.',q:'Combien de connexions de PC-ACHATS-03 vers l\'adresse du domaine malveillant le pare-feu a-t-il laissé passer, et quel numéro de règle de quelle interface les a autorisées ?',champs:[{k:'a',l:'Nombre de connexions'},{k:'b',l:'Interface'},{k:'c',l:'Numéro de la règle'}],ind:'L\'adresse du domaine se lit dans la requête DNS de Sysmon (événement 22), dans les archives. Filtrez ensuite la vue en direct du pare-feu.'},
{id:'m12',titre:'Il veut revenir',niv:2,ch:['c5',1],de:WR,msg:'Un attaquant qui a mis le pied quelque part prévoit toujours de revenir après un redémarrage. Le HIDS surveille les clés de démarrage.',q:'Quelle valeur de registre a été ajoutée, et quel programme lance-t-elle ?',champs:[{k:'a',l:'Nom de la valeur'},{k:'b',l:'Nom du programme lancé'}],ind:'Wazuh, File Integrity Monitoring, sur PC-ACHATS-03. L\'inventaire a un onglet Windows Registry.'},
{id:'m13',titre:'La balise',niv:3,ch:['c2',2],de:WR,msg:'Ce programme parle à quelqu\'un. Aucune alerte ne le dit, mais les archives gardent tout.',q:'Combien de connexions syncsvc.exe a-t-il ouvertes vers son serveur depuis PC-ACHATS-03, et à quel intervalle en minutes ?',champs:[{k:'a',l:'Nombre de connexions de syncsvc.exe'},{k:'b',l:'Intervalle, en minutes'}],ind:'Les connexions réseau Sysmon ont le niveau 0, elles ne sont pas dans wazuh-alerts. Explore, Discover, index wazuh-archives-*.'},
{id:'m14',titre:'Contenir',niv:2,ch:['c6',3],de:WR,msg:'On en sait assez. Je ne veux plus que PC-ACHATS-03 parle au réseau, mais je garde sa mémoire intacte pour l\'enquête. Et ce poste ne restera pas une minute de plus sans protection.',q:'Dans Elastic Security, isolez PC-ACHATS-03 et rattachez-le à la politique qui bloque.',etat:()=>{const a=!!S.edr.iso['PC-ACHATS-03'],b=edrPol('PC-ACHATS-03')==='Protection';return {ok:a&&b,txt:'Isolement '+(a?'fait':'à faire')+', politique '+edrPolNom('PC-ACHATS-03')}},ind:'Endpoints, colonne Actions : Isolate host ouvre la console de réponse, Reassign policy change la politique.'},
{id:'m15',titre:'La mémoire de LSASS',niv:3,ch:['c6',2],de:WR,msg:'Elastic a vu quelque chose de grave à 9 h 31. Si c\'est ce que je crois, des secrets de session sont partis.',q:'Quel processus a ouvert lsass.exe, avec quel masque d\'accès, et quelle technique ATT&CK cela représente-t-il ?',champs:[{k:'a',l:'Nom du processus'},{k:'b',l:'Masque d\'accès'},{k:'c',l:'Identifiant de la technique'}],ind:'Le processus est dans l\'analyseur d\'Elastic. Le masque d\'accès est dans l\'événement Sysmon 10, dans les archives de Wazuh.'},
{id:'m16',titre:'Pourquoi ici',niv:3,ch:['c5',2],de:WR,msg:'Sur PC-ACHATS-04, le même piège n\'a pas marché. Le HIDS compare chaque poste au guide CIS. Trouvez ce qui manquait sur PC-ACHATS-03.',q:'Quel contrôle de configuration échoué a permis de lire la mémoire de LSASS, et lequel a donné des droits élevés à l\'utilisatrice dès le premier clic ?',champs:[{k:'a',l:'Identifiant du contrôle sur LSASS'},{k:'b',l:'Identifiant du contrôle sur les droits de l\'utilisatrice'}],ind:'Wazuh, Configuration Assessment. Comparez PC-ACHATS-03 et PC-ACHATS-04, contrôle par contrôle.'},
{id:'m17',titre:'La détection qui manquait',niv:3,ch:['c4',0],de:WR,msg:'Aucune règle du SIEM n\'a vu l\'accès à LSASS. C\'est un faux négatif, le pire cas. Écrivez la règle.',q:'Dans local_rules.xml, écrivez une règle de niveau 12 ou plus, avec la technique T1003.001, qui se déclenche sur l\'accès à la mémoire de lsass.exe et sur rien d\'autre. Enregistrez puis rejouez les archives.',etat:()=>socVerifRegleLsass(),ind:'Sysmon note l\'ouverture d\'un processus par un autre avec l\'événement 10. Cherchez sa règle parente dans 0595-win-sysmon_rules.xml, Server management puis Rules.'},
{id:'m18',titre:'Le compte volé',niv:3,ch:['c3',1],de:WR,msg:'À 9 h 46 le serveur de fichiers a accepté une connexion depuis PC-ACHATS-03. Une ouverture de session de type 3, rien d\'alarmant en apparence.',q:'Quel compte a été utilisé, avec quel type de session, et quel service a été installé juste après sur le serveur ?',champs:[{k:'a',l:'Compte'},{k:'b',l:'Type de session'},{k:'c',l:'Nom du service'}],ind:'Agent SRV-FICHIERS-01 entre 9 h 45 et 9 h 47. Elastic Defend n\'est pas déployé sur ce serveur, seul Wazuh le voit.'},
{id:'m19',titre:'Le faux jumeau',niv:3,ch:['c1',1],de:WR,msg:'Quatre minutes plus tard, un deuxième service est créé, cette fois sur PC-ATELIER-02, au cœur de la production. Si l\'attaquant est à l\'atelier, on arrête les machines.',q:'Ce service est-il lié à l\'attaque ? Donnez le compte qui l\'a créé, le ticket qui le justifie, et votre verdict.',champs:[{k:'a',l:'Compte'},{k:'b',l:'Numéro du ticket'},{k:'c',l:'Verdict',t:'sel',o:['Vrai positif malveillant','Vrai positif bénin','Faux positif']}],ind:'Remontez à la machine d\'origine de la session (ipAddress), puis cherchez ce qui s\'y lance juste avant 9 h 50. Elastic voit aussi PC-ADMIN-01.'},
{id:'m20',titre:'Ce qui est parti',niv:3,ch:['c9',0],de:WR,msg:'La direction va me demander ce qui est sorti. Je veux un outil, une destination, un volume et le nom de l\'archive.',q:'Avec quel outil, vers quelle adresse, quel volume approximatif en Go, et sous quel nom d\'archive les données sont-elles sorties ?',champs:[{k:'a',l:'Outil'},{k:'b',l:'Adresse de destination'},{k:'c',l:'Volume en Go, arrondi au dixième'},{k:'d',l:'Nom de l\'archive'}],ind:'Wazuh, le HIDS du serveur, le pare-feu et l\'IDS ont chacun un morceau de la réponse.'},
{id:'m21',titre:'Deux rclone',niv:4,ch:['c9',1],de:WR,msg:'La règle 92018 s\'est déclenchée deux fois ce matin, sur deux serveurs. Le directeur de production me demande si la sauvegarde des plans CAO est compromise.',q:'Quel programme a lancé chaque rclone, et quel critère sépare la sauvegarde de l\'exfiltration ?',champs:[{k:'a',l:'Parent du rclone de SRV-CAO-01'},{k:'b',l:'Parent du rclone de SRV-FICHIERS-01'},{k:'c',l:'Le critère',t:'sel',o:['Le nom de l\'outil','Le chemin, le parent, le compte et la destination','Le niveau de la règle','L\'heure de la journée']}],ind:'Lisez parentImage, user, commandLine et la destination de chaque exécution. Un outil légitime détourné reste un outil légitime pour un antivirus.'},
{id:'m22',titre:'Couper la sortie',niv:3,ch:['c7',1],de:WR,msg:'Le serveur de fichiers a parlé au serveur de l\'attaquant et envoyé près de 2 Go vers une seconde adresse. Fermez la porte de sortie au pare-feu. Sans couper Internet à tout le monde, et sans casser la sauvegarde externe du bureau d\'études.',q:'Sur fw-01, bloquez tout flux vers les deux adresses de l\'attaquant, depuis les postes comme depuis les serveurs. Le reste du trafic doit continuer à passer.',etat:()=>{const t=[['LAN','10.20.0.23','198.51.100.23','block'],['LAN','10.20.0.37','52.97.144.18','pass'],['SERVEURS','10.10.0.20','198.51.100.23','block'],['SERVEURS','10.10.0.20','198.51.100.77','block'],['SERVEURS','10.10.0.25','192.0.2.80','pass'],['SERVEURS','10.10.0.20','13.107.4.50','pass']];const r=t.map(([i,s,d,a])=>socFwTeste(i,s,d,443,'tcp').act===a);return {ok:r.every(Boolean),txt:r.filter(Boolean).length+' contrôle(s) de flux conforme(s) sur '+t.length}},ind:'Les postes entrent par l\'interface LAN, les serveurs par SERVEURS. La première règle qui correspond l\'emporte. Vérifiez dans Diagnostics.'},
{id:'m23',titre:'Fermer le SSH au monde',niv:2,ch:['c7',0],de:WR,msg:'Le site vitrine accepte le SSH depuis n\'importe où. Seul notre prestataire web, depuis 192.0.2.50, en a besoin. Le site doit rester joignable en HTTPS.',q:'Corrigez les règles WAN pour que le SSH du serveur web ne soit joignable que depuis 192.0.2.50.',etat:()=>{const t=[['203.0.113.66',22,'block'],['192.0.2.50',22,'pass'],['198.18.7.21',443,'pass'],['198.18.7.21',22,'block']];const r=t.map(([s,p,a])=>socFwTeste('WAN',s,'172.16.0.10',p,'tcp').act===a);return {ok:r.every(Boolean),txt:r.filter(Boolean).length+' contrôle(s) de flux conforme(s) sur '+t.length}},ind:'Modifier une règle existante suffit.'},
{id:'m24',titre:'L\'atelier exposé',niv:4,ch:['c5',2],de:WR,msg:'Le directeur de production veut savoir si l\'atelier risque quelque chose. PC-ATELIER-02 pilote les centres d\'usinage. Regardez sa configuration, ses vulnérabilités et ce que le pare-feu lui laisse faire.',q:'Quel contrôle CIS signale le problème de fond de ce poste, combien de vulnérabilités critiques Wazuh lui connaît, et quelle règle de quelle interface lui ouvre Internet ?',champs:[{k:'a',l:'Identifiant du contrôle'},{k:'b',l:'Nombre de vulnérabilités critiques'},{k:'c',l:'Interface'},{k:'d',l:'Numéro de la règle'}],ind:'Configuration Assessment, Vulnerability Detection, puis les règles de fw-01 de l\'interface de la production.'},
{id:'m25',titre:'L\'automate du prestataire',niv:3,ch:['c11',1],de:WR,msg:'Le prestataire a livré un scénario Shuffle qui doit ouvrir une alerte TheHive pour chaque alerte grave de Wazuh. Ce matin, TheHive n\'a rien reçu pour PowerShell lancé par Word. Rejouez les alertes du matin et trouvez pourquoi.',q:'Combien d\'exécutions le scénario reçoit-il, quelle est la cause du trou, et corrigez-le pour que les deux alertes 92011 ouvrent une alerte TheHive.',champs:[{k:'a',l:'Nombre d\'exécutions'},{k:'b',l:'Cause',t:'sel',o:['La condition exige un niveau strictement supérieur à 12','Wazuh n\'envoie rien à Shuffle','TheHive est hors service','VirusTotal a refusé la demande']}],etat:()=>{const wf=sfWf();const r=sfSimule(wf).filter(x=>x.doc.rule.id==='92011');const ok=r.length&&r.every(x=>x.trace.some(t=>t.n&&t.n.act==='Create alert'&&t.ok));return {ok:!!ok&&!!S.soar.run,txt:(S.soar.run?'Rejeu fait':'Rejeu à faire')+', '+r.filter(x=>x.trace.some(t=>t.n&&t.n.act==='Create alert'&&t.ok)).length+' alerte(s) 92011 sur 2 envoyée(s) à TheHive'}},ind:'Ouvrez une exécution 92011 : la branche vers thehive_alert est SKIPPED. Cliquez le point d\'interrogation de la branche pour lire sa condition. Shuffle ne connaît que larger than et less than.'},
{id:'m26',titre:'Isoler sans arrêter l\'usine',niv:4,ch:['c11',2],de:WR,msg:'La direction veut que l\'isolement soit automatique pour les alertes de niveau 12 et plus. Je veux bien, à une condition : que l\'automate ne coupe jamais la production sur une fausse alerte. Rappelez-vous 7 h 35.',q:'Ajoutez au scénario une action Elastic Security qui isole la machine de l\'alerte. Après rejeu, PC-ACHATS-03 doit être isolé, SRV-CAO-01 jamais.',etat:()=>{const wf=sfWf();const iso=new Set();sfSimule(wf).forEach(x=>x.trace.forEach(t=>{if(t.n&&t.n.act==='Isolate host'&&t.ok&&t.out.body)t.out.body.agents.forEach(a=>iso.add(a));}));const a=iso.has('PC-ACHATS-03'),b=!iso.has('SRV-CAO-01'),c=!S.edr.iso['SRV-CAO-01'];return {ok:a&&b&&c&&!!S.soar.run,txt:'PC-ACHATS-03 '+(a?'isolé':'non isolé')+' par le scénario, SRV-CAO-01 '+(b?'épargné':'isolé par le scénario')+(c?'':', et encore isolé dans Elastic')}},ind:'Le nom de la machine est dans $exec.agent.name. Une condition de plus sur la branche suffit. Si l\'automate a déjà isolé SRV-CAO-01, libérez-le dans Elastic avec release.'},
{id:'m27',titre:'Le rapport',niv:3,ch:['c9',2],de:WR,msg:'Dernière étape. La direction lit le résumé, le CERT lit les indicateurs, l\'équipe système lit les recommandations.',q:'Remplissez le rapport d\'incident dans la main courante. Patient zéro, domaine désarmé, compte dérobé et serveur atteint doivent être exacts, et la main courante doit compter au moins huit constats.',etat:()=>{const R=S.rapport,ok=[['p0','m27.p0'],['c2','m27.c2'],['compte','m27.compte'],['srv','m27.srv']].map(([k,h])=>repOk(h,R[k]));const n=S.main.length;return {ok:ok.every(Boolean)&&n>=8&&(R.resume||'').length>=40,txt:ok.filter(Boolean).length+' champ(s) exact(s) sur 4, '+n+' constat(s) dans la main courante'+((R.resume||'').length<40?', résumé à écrire':'')}},ind:'Main courante, en bas de page.'},
{id:'b1',bonus:1,titre:'Bonus, la même empreinte',ch:['c5',1],de:WR,msg:'Demain on passera les empreintes à VirusTotal. Préparez le terrain.',q:'Donnez les huit premiers caractères de l\'empreinte SHA256 de syncsvc.exe, et le nom de l\'autre machine où le même fichier a été déposé.',champs:[{k:'a',l:'Huit premiers caractères'},{k:'b',l:'Autre machine'}],ind:'Le HIDS calcule l\'empreinte des fichiers ajoutés. Cherchez la valeur dans Threat Hunting.'},
{id:'b2',bonus:1,titre:'Bonus, détecter le mouvement latéral',ch:['c4',1],de:WR,msg:'Le compte de sauvegarde n\'a rien à faire sur une session réseau ouverte depuis un poste utilisateur. Il travaille pourtant tous les matins sur SRV-CAO-01.',q:'Écrivez une règle locale de niveau 10 ou plus qui se déclenche quand svc-sauvegarde ouvre une session réseau depuis une adresse du réseau des postes, et sur aucune autre ouverture de session.',etat:()=>socVerifRegleLat(),ind:'Fille de 60106. Les champs logonType et ipAddress font la différence avec la tâche planifiée de 7 h 35.'},
{id:'b3',bonus:1,titre:'Bonus, éradiquer',ch:['c6',3],de:WR,msg:'Le serveur n\'a pas d\'EDR, mais tous les postes en ont un. Faisons en sorte que syncsvc.exe ne démarre plus nulle part, et coupons celui qui tourne encore.',q:'Dans Elastic Security, ajoutez l\'empreinte de syncsvc.exe à la liste de blocage et tuez le processus syncsvc.exe qui tourne sur PC-ACHATS-03.',etat:()=>{const a=S.edr.bloc.includes(SOC_H.syncsvc.sha256);const P=(edrModele()['PC-ACHATS-03']||{procs:[]}).procs.find(p=>p.nom==='syncsvc.exe');const b=P&&S.edr.tue.includes('PC-ACHATS-03|'+P.pid);return {ok:a&&!!b,txt:'Empreinte '+(a?'bloquée':'à bloquer')+', processus '+(b?'arrêté':'à arrêter')}},ind:'Analyzer, puis la console de réponse : processes, puis kill-process --pid.'}
];

function repOk(cle,val){const h=SOC_REP[cle];if(!h)return false;return h.includes(socSha('soc|'+cle+'|'+normal(val)));}
function socVerifRegleLsass(){
 const cible=SOC_EVT.find(e=>e.win&&e.win.system.eventID==='10');
 const okSet=new Set([cible.n]);
 const loc=ANALYSE.filter(x=>x.rule&&x.rule.local&&x.rule.level>=12);
 const bon=loc.filter(x=>okSet.has(x.e.n));
 const ids=new Set(bon.map(x=>x.rule.id));
 const trop=loc.filter(x=>ids.has(x.rule.id)&&!okSet.has(x.e.n)&&!(x.e.win&&/comsvcs/i.test(x.e.win.eventdata.commandLine||'')));
 const mitre=bon.some(x=>x.rule.mitre.includes('T1003.001'));
 if(MOTEUR.errs.length)return {ok:false,txt:'Le fichier de règles contient une erreur'};
 if(!bon.length)return {ok:false,txt:'Aucune règle locale de niveau 12 ou plus ne se déclenche sur l\'accès à LSASS'};
 if(trop.length)return {ok:false,txt:'Votre règle se déclenche aussi sur '+trop.length+' autre(s) événement(s)'};
 if(!mitre)return {ok:false,txt:'La règle se déclenche, mais la technique T1003.001 manque'};
 return {ok:true,txt:'Règle '+bon[0].rule.id+' en place'};
}
function socVerifRegleLat(){
 const cible=SOC_EVT.find(e=>e.win&&e.win.system.eventID==='4624'&&e.win.eventdata.targetUserName==='svc-sauvegarde'&&e.win.eventdata.logonType==='3');
 const loc=ANALYSE.filter(x=>x.rule&&x.rule.local&&x.rule.level>=10&&x.e.win&&x.e.win.system.eventID==='4624');
 if(MOTEUR.errs.length)return {ok:false,txt:'Le fichier de règles contient une erreur'};
 if(!loc.some(x=>x.e===cible))return {ok:false,txt:'Aucune règle locale de niveau 10 ou plus sur cette ouverture de session'};
 const ids=new Set(loc.filter(x=>x.e===cible).map(x=>x.rule.id));
 if(ANALYSE.some(x=>x.rule&&ids.has(x.rule.id)&&x.e!==cible))return {ok:false,txt:'La règle attrape aussi d\'autres événements'};
 return {ok:true,txt:'Règle en place'};
}
function missionDebloquee(i){if(S.tout)return true;if(MISSIONS[i].bonus)return MISSIONS.filter(m=>!m.bonus).every(m=>S.fait[m.id]);return i===0||!!S.fait[MISSIONS[i-1].id];}
function missionsInit(){
 $('#panneau').innerHTML='<button class="languette">MISSIONS</button><div class="pcontenu"><div class="ptete"><b>MISSIONS</b><button class="fer" title="Replier, touche M">×</button></div><div class="pprog"></div><div class="pliste"></div></div>';
 $('#panneau .languette').onclick=basculePanneau;$('#panneau .fer').onclick=basculePanneau;
 if(S.pferme)$('#panneau').classList.add('ferme');
 if(!S.ouvert){const i=MISSIONS.findIndex((m,k)=>missionDebloquee(k)&&!S.fait[m.id]);S.ouvert=i>=0?MISSIONS[i].id:null;}
 missionsRendu();
}
function basculePanneau(){const p=$('#panneau');p.classList.toggle('ferme');S.pferme=p.classList.contains('ferme');sauve();}
function missionsRendu(){
 const n=MISSIONS.filter(m=>!m.bonus&&S.fait[m.id]).length,tot=MISSIONS.filter(m=>!m.bonus).length;
 $('#panneau .pprog').innerHTML=n+' mission'+(n>1?'s':'')+' sur '+tot+(MISSIONS.some(m=>m.bonus&&S.fait[m.id])?', plus '+MISSIONS.filter(m=>m.bonus&&S.fait[m.id]).length+' bonus':'')+'<div class="pbarre"><i style="width:'+Math.round(n/tot*100)+'%"></i></div>';
 let h='';
 MISSIONS.forEach((m,i)=>{
  const ok=!!S.fait[m.id],deb=missionDebloquee(i),ouv=S.ouvert===m.id&&deb;
  h+='<div class="mi'+(ok?' ok':'')+(deb?'':' verrou')+'" data-m="'+m.id+'"><div class="mt"><span class="mn">'+(m.bonus?'B'+m.id.slice(1):String(i+1).padStart(2,'0'))+'</span><span class="mtt">'+esc(m.titre)+'</span></div>';
  if(ouv){
   const chc=SOC_COURS.find(c=>c.id===m.ch[0]);const sec=chc&&chc.sections[m.ch[1]||0];

async function codeOk(code){
 const c=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<10||!window.crypto||!crypto.subtle)return false;
 try{
  const b64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(c),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SOC_VERROU[0]),iterations:310000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(SOC_VERROU[1])},k,b64(SOC_VERROU[2]));
  return true;
 }catch(e){return false;}
}
